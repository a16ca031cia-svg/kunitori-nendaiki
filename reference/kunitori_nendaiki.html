    if (stage == null || sd === Infinity) continue;
    const gar = armiesAt(t.id).filter(x => total(x.t) > 0);
    const dp = gar.length ? powerOf(gar, t, true) : 0;
    const goalCap = (warGoal(nid, t.owner) === 'capital' && t.cap ? 60 : 0)
      + (G.dip.capId && G.dip.capId[nid][t.owner] === t.id && warGoal(nid, t.owner) === 'claim' ? 90 : 0)   // 望んでいた土地
      + (desiresOf(nid).some(d => d.t === t.id) ? 40 : 0);

      + (t.type === 'fort' ? -8 : 6) + (isTopThreat(t.owner) ? 15 : 0)
      + contig(t, nid) * 10                       // 自国と地続きになる所を好む
      + reconnect(t, nid) * 14                    // 孤立した自国領をつなぎ直せる所
      - foeNbrs(t, nid) * 6                       // 敵地に深く突き出す形は避ける
      - dp / 900 - sd * 7

function newGame(size) {
  resetColors();
  G = size === 'japan' ? genJapan() : genMap(size); G.observer = true; invalidateMap();
  for (const t of G.terrs) { t.home = t.owner; t.homeCap = !!t.cap; }   // 開始時の持ち主（滅びた国の旧領）
  G.factions = {};

  NS_KEY = '';
  beginGame();
}
function beginGame() {
  const observer = G.observer;
  UI.sel = observer ? null : G.nations[0].capital; UI.selArmy = observer ? null : G.nations[0].armies[0]; NATPICK_KEY = '';
  UI.selRoad = null; UI.busy = false; UI.auto = false; G.log = [];
  UI.selNat = observer ? null : 0;
  $('#titleScreen').style.display = 'none';
  $('#btnBattleView').classList.toggle('on', CFG.showCpuBattle);
  resizeCanvas(); startView(); refreshSupply(true);
  chron(`${G.nations.length}つの国が並び立つ — ${G.nations.map(n => n.name).join('、')}`, -1, 'end');
  for (const n of G.nations) chron(`${n.name}、${T(n.capital).name} に旗を立てる（${PERSONA[n.persona].n}）`, n.id, 'gov');
  recordHistory();
  if (observer) {
    logMsg(`観戦モード：全${G.nations.length}か国をCPUが操作します`, 'good');
    logMsg('「自動進行」で連続再生、「戦闘表示」で戦闘画面の表示を切り替えられます', '');
  } else {
    logMsg(`${PL().name} として ${T(PL().capital).name} より出立`, 'good');
    logMsg('攻め込むには「外交」から宣戦布告が必要です（平和な相手の領内には入れません）', '');
  }
  refresh();
}
async function toggleAuto() {
  if (!G || G.over) return;
  UI.auto = !UI.auto;
  const b = $('#btnAuto');
  b.classList.toggle('on', UI.auto);
  b.innerHTML = UI.auto ? '■ 停止' : '自動<span class="lg">進行</span>';

}

window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
  if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;    // ボタンに焦点がある時はそのボタンを押す（二重に動かさない）
  const modal = $('#modals').lastElementChild;
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) { closeMenu(); return; }
    if (modal) { const x = modal.querySelector('#btSkip,#btOk,[data-x],.mh button.x'); if (x) { e.preventDefault(); x.click(); } return; }   // 戦闘画面はスキップ／閉じる
    if (G && UI.selNat != null) { selectNation(null); return; }
    return;
  }
  if (modal || !G || getComputedStyle($('#titleScreen')).display !== 'none') return;
  const k = e.key;
  const pan = 120 / UI.view.s;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!UI.busy && !UI.auto) $('#btnEnd').click(); }
  else if (k === 'a' || k === 'A') toggleAuto();
  else if (k === 'r' || k === 'R') openRecord();
  else if (k === 'f' || k === 'F') { fitView(); clampView(); draw(); }
  else if ((k === 'c' || k === 'C') && UI.selNat != null) { frameNation(UI.selNat); draw(); }
  else if (k === '+' || k === '=' || k === ';') zoomAt(1.25, CW / 2, CH / 2);
  else if (k === '-') zoomAt(.8, CW / 2, CH / 2);
  else if (k === '[') setSpeed((UI.speed || 0) - 1);
  else if (k === ']') setSpeed((UI.speed || 0) + 1);
  else if (k === '?') openHelp();
  else if (k.startsWith('Arrow')) {
    e.preventDefault();
    if (k === 'ArrowLeft') UI.view.x -= pan; if (k === 'ArrowRight') UI.view.x += pan;
    if (k === 'ArrowUp') UI.view.y -= pan; if (k === 'ArrowDown') UI.view.y += pan;
    clampView(); draw();
  }
});
{                                                   // 前回の表示の好みを戻す

/* ============================================================
   日本地図の生成：細かい点でボロノイを作り、地点ごとに領地へまとめる
   ============================================================ */
const JP = { U: 6.5, S: 4, lon0: 127.6, lat1: 45.9 };   // 1km＝6.5、細かい点の間隔＝約4km
function jpProj(lon, lat) {
  const kx = 111.32 * Math.cos(36.5 * Math.PI / 180) * JP.U, ky = 110.95 * JP.U;
  return [(lon - JP.lon0) * kx, (JP.lat1 - lat) * ky];
}
function pip(x, y, poly) {                // 多角形の内側か（交差数）
  let ins = false;

  };
  const tAdj = Array.from({ length: NT }, () => new Set()), coastT = new Array(NT).fill(false);
  const kk = p => Math.round(p[0] * 2) + ',' + Math.round(p[1] * 2);
  const tileSn = new Array(NT);                  // 各辺の向こう側の領地（水は -1）
  const tileSegs = tiles.map((tl, a) => {
    const segs = [], sn = [];
    for (const i of tl.cells) {
      const p = V.polys[i];
      for (let e = 0; e < p.length; e++) {
        const j = V.edgeNb[i][e];
        if (j >= 0 && isLand(j) && tileOf[j] === a) continue;
        const A = p[e], B = p[(e + 1) % p.length];
        if (j >= 0 && isLand(j)) tAdj[a].add(tileOf[j]); else coastT[a] = true;
        // 領地どうしの境は少し揺らす。県境の点どうしの境は本当の県境をなぞるので真っ直ぐ
        const bdr = isBorder.has(i - NA) || (j >= 0 && isBorder.has(j - NA));
        segs.push(j >= 0 && isLand(j) && !bdr ? lineFor(i, j, A, B) : [[A[0], A[1]], [B[0], B[1]]]);
        sn.push(j >= 0 && isLand(j) ? tileOf[j] : -1);
      }
    }
    const byStart = new Map();
    segs.forEach((s2, idx) => { const k = kk(s2[0]); (byStart.get(k) || byStart.set(k, []).get(k)).push(idx); });
    const usedS = new Array(segs.length).fill(false), out = [], outN = [], chainStart = [];
    for (let st = 0; st < segs.length; st++) {
      if (usedS[st]) continue;
      let cur = st; chainStart.push(out.length);
      while (cur != null && !usedS[cur]) {
        usedS[cur] = true; out.push(segs[cur]); outN.push(sn[cur]);
        const nx = (byStart.get(kk(segs[cur][segs[cur].length - 1])) || []).find(x => !usedS[x]);
        cur = nx === undefined ? null : nx;
      }
    }
    if (ver < 5) { tileSn[a] = outN; return out.map(sg => sg.map(([x, y]) => [Math.round(x), Math.round(y)])); }
    // 第5版：同じ相手との境を一本の線にまとめる（点の重なりも除く）
    const q4 = v => Math.round(v * 4) / 4, res = [], resN = [];
    const isStart = new Set(chainStart);
    for (let k = 0; k < out.length; k++) {
      const pts = out[k].map(([x, y]) => [q4(x), q4(y)]);
      const prev = res.length ? res[res.length - 1] : null;
      if (prev && !isStart.has(k) && resN[resN.length - 1] === outN[k]) { for (let m = 1; m < pts.length; m++) prev.push(pts[m]); }
      else { res.push(pts); resN.push(outN[k]); }
    }
    for (let k = 0; k < res.length; k++) {
      const sg = res[k], o = [sg[0]];
      for (let m = 1; m < sg.length; m++) { const l = o[o.length - 1]; if (sg[m][0] !== l[0] || sg[m][1] !== l[1]) o.push(sg[m]); }
      if (o.length === 1) o.push(o[0].slice());
      res[k] = o;
    }
    // 角に残ったごく短い切れ端（0.1km 未満）は捨てる
    const keep = res.map(sg => sg.length > 2 || Math.hypot(sg[1][0] - sg[0][0], sg[1][1] - sg[0][1]) >= .65);
    tileSn[a] = resN.filter((_, k) => keep[k]);
    return res.filter((_, k) => keep[k]);
  });

  JP_PROF.push(['segs', performance.now()]);
  /* --- 5) 地形：実際の山地・平野の目安＋海からの距離＋ゆらぎ --- */
  const cdist = new Array(NT).fill(-1), q = [];
  for (let a = 0; a < NT; a++) if (coastT[a]) { cdist[a] = 0; q.push(a); }
  for (let h = 0; h < q.length; h++) for (const b of tAdj[q[h]]) if (cdist[b] < 0) { cdist[b] = cdist[q[h]] + 1; q.push(b); }
  const relief = (lon, lat) => { let e = 0; for (const [lo, la, r, s2] of JP_RELIEF) e += s2 * Math.exp(-(((lon - lo) ** 2) + ((lat - la) ** 2)) / (r * r)); return e; };
  const nz = waveNoise(6, 400, 1200), mz = waveNoise(6, 500, 1400);
  const elev = tiles.map((t, i) => {
    let e = 0;
    for (const c of t.cells) e += relief(lonOf(sites[c][0]), latOf(sites[c][1]));
    e /= t.cells.length;
    const [x, y] = sites[t.c];
    return e + Math.max(0, cdist[i]) * .09 + nz(x, y) * .25;
  });
  const moist = tiles.map((t, i) => {
    const [x, y] = sites[t.c], lon = lonOf(x), lat = latOf(y);
    return mz(x, y) + (cdist[i] === 0 ? .25 : 0) - (lon > 143 && lat > 42.5 ? .9 : 0) - (Math.hypot(lon - 131.1, lat - 32.95) < .35 ? .8 : 0);
  });
  const terr = new Array(NT).fill('plain');
  {
    let rest = tiles.map((_, i) => i);
    const take = (cnt, key, kind) => { rest.sort((x, y) => key(y) - key(x)); for (const i of rest.slice(0, cnt)) terr[i] = kind; rest = rest.slice(cnt); };
    take(Math.round(NT * .18), i => elev[i], 'mount');
    take(Math.round(NT * .22), i => elev[i], 'hill');
    take(Math.round(NT * .05), i => moist[i] - elev[i], 'marsh');
    take(Math.round(NT * .08), i => -moist[i], 'grass');
    take(Math.round(NT * .2), i => moist[i] + elev[i] * .3, 'forest');
  }
  tiles.forEach((t, i) => { if ((t.cap || t.big) && TERRAIN[terr[i]].slow) terr[i] = 'plain'; });

  /* --- 6) 領地 --- */
  const terrs = tiles.map((tl, i) => {
    const rough = terr[i] === 'mount' || terr[i] === 'hill';
    const fort = !tl.cap && !tl.big && Math.random() < (rough ? .45 : .12);
    const [x, y] = sites[tl.c];
    const t = {
      id: i, x, y, segs: tileSegs[i], sn: tileSn[i], owner: tl.pref, cap: !!tl.cap,
      type: fort ? 'fort' : 'city', name: tl.nm,
      dev: tl.cap ? 3 : tl.big ? 3 : (tl.anc.length >= 2 ? 2 : ri(1, 2)), devP: false, bld: [], chaos: 0,
      pop: 0, sec: CFG.secStart, link: 1, trait: null, terrain: terr[i], infra: 1
    };
    t.pop = Math.round((t.type === 'city' ? CFG.popCity : CFG.popFort) * t.dev * .7 * terrOf(t).pop);
    if (Math.random() < TRAIT_RATE) {
      const keys = TRAIT_KEYS.filter(k => !(TRAIT[k].city && t.type !== 'city'));
      t.trait = pick(keys);
    }
    return t;
  });

  JP_PROF.push(['terr', performance.now()]);
  /* --- 7) つながり：陸で隣り合う領地はどこへでも行ける＋海峡の渡し --- */
  const edges = [], ekey = new Map();
  const addEdge = (a, b, sea) => {
    if (a === b) return null;
    const k = a < b ? a + '_' + b : b + '_' + a;
    if (ekey.has(k)) return null;
    const A = terrs[a], B = terrs[b];
    const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
    const w = sea ? (Math.random() * 2 - 1) * L * .08 : 0;
    const e = { a, b, lv: 3, pend: false, cx: -dy / L * w, cy: dx / L * w };
    if (sea) e.sea = true;
    edges.push(e); ekey.set(k, e); return e;
  };
  for (let a = 0; a < NT; a++) for (const b of tAdj[a]) if (a < b) addEdge(a, b, false);
  const tileByName = nm => { const a = anchors.findIndex(x => x.nm === nm); return a >= 0 ? tileOf[a] : -1; };
  for (const [p1, p2] of JP_SEA) {
    const a = tileByName(p1), b = tileByName(p2);
    if (a >= 0 && b >= 0) addEdge(a, b, true);
  }
  // 取り残された島があれば、いちばん近い領地へ渡しを結ぶ
  for (let guard = 0; guard < 60; guard++) {
    const comp2 = new Int32Array(NT).fill(-1), adjE = Array.from({ length: NT }, () => []);
    for (const e of edges) { adjE[e.a].push(e.b); adjE[e.b].push(e.a); }
    let nc = 0; const sizes = [];
    for (let s0 = 0; s0 < NT; s0++) {
      if (comp2[s0] >= 0) continue;
      const st = [s0]; comp2[s0] = nc; let sz = 0;
      while (st.length) { const u = st.pop(); sz++; for (const v of adjE[u]) if (comp2[v] < 0) { comp2[v] = nc; st.push(v); } }
      sizes.push(sz); nc++;
    }
    if (nc <= 1) break;
    let sm = 0; for (let c = 1; c < nc; c++) if (sizes[c] < sizes[sm]) sm = c;
    let ba = -1, bb = -1, bd = Infinity;
    for (let a = 0; a < NT; a++) if (comp2[a] === sm) for (let b = 0; b < NT; b++) if (comp2[b] !== sm) {
      const d = d2(terrs[a].x, terrs[a].y, [terrs[b].x, terrs[b].y]); if (d < bd) { bd = d; ba = a; bb = b; }
    }
    addEdge(ba, bb, true);
  }
  /* 川をまたぐつながり（橋のない所は渡るのに時間がかかる） */
  {
    const cross = (p1, p2, p3, p4) => {
      const d = (p2[0] - p1[0]) * (p4[1] - p3[1]) - (p2[1] - p1[1]) * (p4[0] - p3[0]);
      if (!d) return false;
      const u = ((p3[0] - p1[0]) * (p4[1] - p3[1]) - (p3[1] - p1[1]) * (p4[0] - p3[0])) / d;
      const v = ((p3[0] - p1[0]) * (p2[1] - p1[1]) - (p3[1] - p1[1]) * (p2[0] - p1[0])) / d;
      return u > 0 && u < 1 && v > 0 && v < 1;
    };
    const R = JP_RIVERS.map(([, pts]) => pts.map(([lo, la]) => { const [x, y] = jpProj(lo, la); return [x - ox, y - oy]; }));
    for (const e of edges) {
      if (e.sea) continue;
      const A = [terrs[e.a].x, terrs[e.a].y], B = [terrs[e.b].x, terrs[e.b].y];
      if (R.some(r => r.some((p, i) => i > 0 && cross(A, B, r[i - 1], p)))) e.river = true;
    }
  }
  /* インフラ：史実の街道が通る領地と大きな町ほど高い（1〜3） */
  {
    const gcs = S, gw2 = Math.ceil(W / gcs) + 1, sg = new Map();
    for (let i = 0; i < NL; i++) {
      if (tileOf[i] < 0) continue;
      const k = Math.floor(sites[i][0] / gcs) + Math.floor(sites[i][1] / gcs) * gw2;
      (sg.get(k) || sg.set(k, []).get(k)).push(i);
    }
    const tileAt = (x, y) => {
      const gx = Math.floor(x / gcs), gy = Math.floor(y / gcs);
      let best = -1, bd = (S * 2) ** 2;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) for (const i of sg.get(gx + dx + (gy + dy) * gw2) || []) {
        const d = d2(x, y, sites[i]); if (d < bd) { bd = d; best = i; }
      }
      return best >= 0 ? tileOf[best] : -1;
    };
    for (const [lv, , pts] of JP_ROADS) {
      const P = pts.map(([lo, la]) => { const [x, y] = jpProj(lo, la); return [x - ox, y - oy]; });
      for (let i = 0; i + 1 < P.length; i++) {
        const [ax, ay] = P[i], [bx, by] = P[i + 1], n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / (S * .5)));
        for (let k = 0; k <= n; k++) {
          const t = tileAt(ax + (bx - ax) * k / n, ay + (by - ay) * k / n);
          if (t >= 0 && terrs[t].infra < lv) terrs[t].infra = lv;
        }
      }
    }
    for (const t of terrs) if (t.cap || tiles[t.id].big) t.infra = 3;
  }

  JP_PROF.push(['edges', performance.now()]);
  /* --- 8) 国（47都道府県） --- */
  const pAdj = Array.from({ length: NN }, () => new Set());
  for (const e of edges) { const pa = terrs[e.a].owner, pb = terrs[e.b].owner; if (pa !== pb) { pAdj[pa].add(pb); pAdj[pb].add(pa); } }
  const cols = jpColors(pAdj, NN);
  NCOL.length = 0; for (const c of cols) NCOL.push(c);
  const kinds = ['aggr', 'def', 'econ', 'bal'];
  const pk = []; for (let i = 0; i < NN; i++) pk.push(kinds[i % 4]); pk.sort(() => Math.random() - .5);
  const nations = JP_PREFS.map(([pn], k) => ({
    id: k, name: pn, color: cols[k],
    gold: 10000, stock: { inf: 3000, spe: 0, arc: 0, cav: 0 },
    gens: [], armies: new Array(ARMY_MAX).fill(null), alive: true,
    capital: terrs.findIndex(t => t.owner === k && t.cap), player: false,
    persona: pk[k],
    wins: 0, losses: 0, recLed: 0, badHarv: 0, mile: {}, threat: 0,
    food: 0, foodIn: 0, foodNeed: 0, fatigue: 0,
    lord: null, unrest: 0, revoltBuff: 0, policy: 'none', policyAt: -99
  }));
  for (const na of nations) {
    const pop = terrs.filter(t => t.owner === na.id).reduce((s2, t) => s2 + t.pop, 0);
    na.food = Math.round((pop / 1000 * CFG.foodPop + 3 * CFG.foodTroop) * 10);
  }
  const g = {
    turn: 1, size: 'japan', W, H, terrs, edges, bars: [], nations, nb: tAdj.map(s2 => Array.from(s2)),
    gid: 1, log: [], over: null, chron: [], hist: [], observer: true, supply: null,
    geo: { ox: Math.round(ox * 100) / 100, oy: Math.round(oy * 100) / 100 }
  };
  initDip(g);
  for (let k = 0; k < NN; k++) {
    const na = nations[k];
    const gen = mkGen(g, na, randomPts());
    na.armies[0] = mkArmy(k, 0, na.capital);
    na.armies[0].t.inf = 3000; na.armies[0].target.inf = 3000;
    na.armies[0].gen = gen.id; gen.army = 0;
    na.stock.inf = 0;
  }
  return g;
}
