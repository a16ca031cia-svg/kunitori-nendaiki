<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国盗り年代記</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#11141a; --ink2:#171b23; --panel:#1d222c; --panel2:#252b38;
  --line:#39414f; --line2:#4d5666;
  --brass:#c9a227; --brass2:#e6c95a; --brass-dim:#6a5718;
  --bone:#eae4d6; --muted:#9b9484; --muted2:#6f6a5e;
  --parch:#d5c6a3; --parch2:#c4b48f; --parchline:#8d7d5c;
  --danger:#c0504a; --ok:#6d9c63; --warn:#d29b3c;
  --fs-xs:11px; --fs-s:12.5px; --fs-m:14px; --fs-l:17px; --fs-xl:23px; --fs-xxl:38px;
  --disp:"Shippori Mincho B1",serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:var(--body); font-size:var(--fs-m); line-height:1.55;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; -webkit-text-size-adjust:100%;
}
button{font-family:inherit; font-size:var(--fs-s); color:var(--bone); cursor:pointer;
  background:var(--panel2); border:1px solid var(--line2); border-radius:2px; padding:6px 11px;
  transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#31394a; border-color:var(--brass)}
button:disabled{opacity:.38; cursor:not-allowed}
#natPick{font-family:inherit; font-size:var(--fs-s); color:var(--bone); background:var(--panel2); border:1px solid var(--line2); border-radius:2px; padding:6px 8px; width:130px; cursor:pointer}
#natPick:hover{border-color:var(--brass)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass); outline-offset:1px}
.btn-p{background:linear-gradient(#8a6f1c,#6d5715); border-color:#a98c2c; color:#fdf6dd; font-weight:700}
.btn-p:hover:not(:disabled){background:linear-gradient(#a1832a,#7d6519)}
.btn-d{border-color:#7a3b37; color:#e8b0ac}
input,select{font-family:var(--body); font-size:var(--fs-s); color:var(--bone);
  background:var(--ink2); border:1px solid var(--line); border-radius:2px; padding:4px 7px; width:100%}
input[type=number]{font-family:var(--mono); font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--disp); font-weight:600; margin:0; text-wrap:balance; letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums; font-family:var(--mono)}
.lbl{font-size:var(--fs-xs); letter-spacing:.14em; color:var(--muted); text-transform:uppercase}

/* ---------- メニュー ---------- */
.menu{position:fixed; z-index:30; min-width:190px; background:var(--panel); border:1px solid var(--line2); border-top:2px solid var(--brass);
  border-radius:3px; box-shadow:0 14px 40px #000a; padding:6px; display:flex; flex-direction:column; gap:3px}
.menu[hidden]{display:none}
.menu button{text-align:left; border-color:transparent; background:none; padding:8px 10px 8px 30px; position:relative}
.menu button:hover{background:#2b3140}
.menu button[role=menuitemcheckbox]::before{content:""; position:absolute; left:10px; top:50%; width:11px; height:11px; margin-top:-6px;
  border:1px solid var(--line2); border-radius:2px}
.menu button.on[role=menuitemcheckbox]::before{content:"✓"; color:var(--brass); border-color:var(--brass); font-size:10px; line-height:10px; text-align:center}
.menu-sep{height:1px; background:var(--line); margin:3px 4px}
.menu .sm-only{display:none}
#spdPick{width:auto; background:var(--panel2); border:1px solid var(--line2); padding:6px 6px; cursor:pointer}

kbd{font-family:var(--mono); font-size:var(--fs-xs); border:1px solid var(--line2); border-bottom-width:2px; border-radius:3px; padding:1px 6px; background:var(--ink2); white-space:nowrap}
table.keys td{padding:6px 8px} table.keys td:first-child{width:110px}
/* ---------- shell ---------- */
.app{display:grid; grid-template-rows:auto 1fr; grid-template-columns:minmax(0,1fr); height:100vh; height:100dvh}
.topbar{display:flex; align-items:center; gap:18px; padding:0 14px; height:52px;
  background:linear-gradient(#20252f,#171b23); border-bottom:1px solid var(--brass-dim,#6a5718);
  box-shadow:0 1px 0 #0009,0 6px 18px #0006; z-index:5}
.tb-title{font-family:var(--disp); font-size:var(--fs-l); font-weight:800; color:var(--brass); letter-spacing:.1em; white-space:nowrap}
.tb-stats{display:flex; gap:16px; align-items:center; flex:1 1 240px; min-width:0; overflow-x:auto; scrollbar-width:none}
.tb-stats::-webkit-scrollbar{display:none}
.stat{display:flex; flex-direction:column; line-height:1.15; white-space:nowrap}
.stat b{font-size:var(--fs-m); font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}
.stat .lbl{font-size:10px; letter-spacing:.1em}
.stat.gold b{color:var(--brass)}
.tb-actions{display:flex; gap:7px; flex:0 0 auto; min-width:max-content}
.tb-actions > *{flex:0 0 auto}
.tb-actions > :first-child{margin-left:auto}
.tb-actions button{white-space:nowrap}
.tb-actions button.on{border-color:var(--brass); color:var(--brass); background:#2b2a1e}

.stage{position:relative; display:grid; grid-template-columns:1fr 336px; min-height:0}
.mapwrap{position:relative; overflow:hidden; background:#0e1116}
canvas#map{display:block; width:100%; height:100%; cursor:grab; touch-action:none}
canvas#map.dragging{cursor:grabbing}
canvas#map.targeting{cursor:crosshair}

.side{background:var(--panel); border-left:1px solid var(--line); overflow-y:auto; padding:0 0 60px}
.side::-webkit-scrollbar{width:9px} .side::-webkit-scrollbar-thumb{background:#39414f; border-radius:9px}
.side-empty{padding:26px 18px; color:var(--muted); font-size:var(--fs-s)}
.wrank{display:flex; align-items:center; gap:7px; padding:3px 4px; border-radius:2px; cursor:pointer; font-size:var(--fs-s)}
.wrank:hover{background:#232936}
.wrank b{font-weight:500; min-width:62px}
.wrank .num{min-width:28px; text-align:right; color:var(--muted)}
.wd{min-width:26px; text-align:left}
.wno{width:16px; color:var(--muted2); font-family:var(--mono); font-size:var(--fs-xs); text-align:right}
.wline{font-size:var(--fs-s); margin-top:3px}
.wl{cursor:pointer} .wl:hover{text-decoration:underline}
.pn{border-bottom:1px solid var(--line); padding:13px 15px}
.pn-h{display:flex; align-items:baseline; gap:8px; margin-bottom:9px}
.pn-h h3{font-size:var(--fs-l)}
.chip{font-size:var(--fs-xs); padding:1px 7px; border-radius:2px; border:1px solid var(--line2); color:var(--muted)}
.chip.own{border-color:currentColor}
.kv{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:var(--fs-s)}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right; font-variant-numeric:tabular-nums}
.row{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.slots{display:flex; gap:5px; flex-wrap:wrap; margin:8px 0}
.slot{flex:1 1 84px; min-height:44px; border:1px dashed var(--line2); border-radius:2px; padding:5px 6px;
  font-size:var(--fs-xs); display:flex; flex-direction:column; justify-content:center; background:#161a22}
.slot.filled{border-style:solid; border-color:var(--line2); background:var(--panel2)}
.slot b{font-size:var(--fs-s); font-weight:500}
.slot small{color:var(--muted)}
.armyline{display:flex; align-items:center; gap:8px; padding:6px 7px; border:1px solid var(--line); border-radius:2px;
  background:var(--ink2); margin-top:5px; cursor:pointer; font-size:var(--fs-s)}
.armyline:hover{border-color:var(--brass)}
.armyline.sel{border-color:var(--brass); background:#2a2a20}
.armyline .num{margin-left:auto; color:var(--muted)}
.dot{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 1px #0007}
.bar{height:5px; background:#0d1015; border-radius:3px; overflow:hidden; display:flex}
.bar i{display:block; height:100%}

/* ---------- log / hint ---------- */
.log{position:absolute; left:12px; top:12px; width:340px; max-height:190px; overflow:hidden;
  display:flex; flex-direction:column; gap:3px; pointer-events:none}
.log div{opacity:.95}
.log div{background:#12151bd9; border-left:2px solid var(--line2); padding:4px 9px; font-size:var(--fs-s);
  border-radius:0 2px 2px 0; color:#d6d0c1; backdrop-filter:blur(2px)}
.log div.war{border-left-color:var(--danger)}
.log .lt{color:var(--muted2); font-family:var(--mono); font-size:10px; margin-right:7px}
.log div.good{border-left-color:var(--ok)}
.hint{position:absolute; left:50%; top:14px; transform:translateX(-50%); background:#12151be6;
  border:1px solid var(--brass); color:var(--brass); padding:5px 14px; font-size:var(--fs-s); border-radius:2px;
  display:none}
.hint.on{display:block}
.tip{position:absolute; z-index:8; pointer-events:none; background:#141820f0; border:1px solid var(--line2); border-radius:3px;
  padding:5px 9px; font-size:var(--fs-xs); color:var(--bone); box-shadow:0 6px 18px #0008; max-width:300px; line-height:1.5}
.tip[hidden]{display:none}
.tip b{font-size:var(--fs-s)}
.maptools{position:absolute; right:12px; top:12px; display:flex; gap:6px; z-index:6}
.maptools button{background:#12151be6; border-color:var(--line2); backdrop-filter:blur(2px)}
.maptools button.on{background:#2b2a1e; border-color:var(--brass); color:var(--brass)}
.zoombar{position:absolute; right:12px; bottom:12px; display:flex; gap:5px}
.zoombar button{width:30px; height:30px; padding:0; font-size:15px}
.paneltog{display:none; position:absolute; right:12px; bottom:58px; width:42px; height:34px; padding:0;
  background:#12151be6; border-color:var(--line2); backdrop-filter:blur(2px); z-index:6}

/* ---------- toast / phase / roster ---------- */
.toast{position:absolute; left:50%; top:56px; transform:translateX(-50%); display:flex; flex-direction:column;
  gap:6px; align-items:center; pointer-events:none; z-index:7; width:min(560px,86%)}
.toast div{background:#1d222cf2; border:1px solid var(--line2); border-left:3px solid var(--warn);
  padding:7px 14px; font-size:var(--fs-s); border-radius:2px; box-shadow:0 8px 24px #0008; animation:tin .18s}
.toast div.err{border-left-color:var(--danger); color:#f2cdc9}
.toast div.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0; transform:translateY(-7px)}}
.phase{position:absolute; left:50%; top:14px; transform:translateX(-50%); display:none; align-items:center; gap:12px;
  background:#12151bf2; border:1px solid var(--line2); border-radius:3px; padding:8px 18px; z-index:6;
  box-shadow:0 8px 26px #0009}
.phase.on{display:flex}
.phase .nm{font-family:var(--disp); font-size:var(--fs-l); letter-spacing:.08em; white-space:nowrap}
.phase .sub{font-size:var(--fs-xs); color:var(--muted); white-space:nowrap}
.phase .dots{display:flex; gap:5px; margin-left:4px}
.phase .pbar{width:90px; height:5px; background:#0d1015; border-radius:3px; overflow:hidden; display:block}
.phase .pbar i{display:block; height:100%}
.phase .dots i{width:8px; height:8px; border-radius:50%; background:#39414f; box-shadow:0 0 0 1px #0006}
.roster{padding:11px 13px 13px; border-bottom:1px solid var(--line); background:#1a1f28}
.rline{display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:2px; cursor:pointer;
  border:1px solid transparent; margin-top:3px}
.rline:hover{background:#232936; border-color:var(--line2)}
.rline.sel{border-color:var(--brass); background:#2a2a1e}
.rline .no{width:20px; height:20px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-size:10px; font-family:var(--mono); color:#fff7e2; box-shadow:0 0 0 1px #0007}
.rline b{font-size:var(--fs-s); font-weight:500}
.rline .loc{font-size:var(--fs-xs); color:var(--muted)}
.rline .loc.go{color:var(--brass)}
.log div.sep{background:none; border:none; padding:3px 0 1px; color:var(--muted2); font-size:10px; letter-spacing:.24em}

/* ---------- modal ---------- */
.ov{position:fixed; inset:0; background:#080a0ecc; display:flex; align-items:center; justify-content:center;
  z-index:40; padding:22px; backdrop-filter:blur(3px)}
.mw{background:var(--panel); border:1px solid var(--line2); border-top:2px solid var(--brass);
  border-radius:3px; box-shadow:0 24px 70px #000b; max-width:min(96vw,980px); width:100%;
  max-height:92vh; display:flex; flex-direction:column}
.mw.sm{max-width:440px} .mw.md{max-width:660px} .mw.wide{max-width:min(97vw,1280px)}
.mh{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line)}
.mh h2{font-size:var(--fs-xl); color:var(--brass)}
.mh .x{margin-left:auto}
.mb{padding:16px; overflow-y:auto}
.mf{padding:11px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
table{width:100%; border-collapse:collapse; font-size:var(--fs-s)}
th,td{padding:5px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:var(--fs-xs); letter-spacing:.1em; color:var(--muted); font-weight:500; text-transform:uppercase}
td .num,th .num{font-variant-numeric:tabular-nums}
th[data-sk]:hover{color:var(--bone)} th.sk-on{color:var(--brass)}
tr[data-srow]:hover td{background:#232936}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:14px; overflow-x:auto}
.tabs button{border:none; border-bottom:2px solid transparent; background:none; border-radius:0; padding:7px 13px; white-space:nowrap}
.tabs button.on{border-bottom-color:var(--brass); color:var(--brass)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.grid4{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px}
.fld{display:flex; align-items:center; gap:8px; font-size:var(--fs-s)}
.fld span{flex:none; width:64px; color:var(--muted)}
.card{background:var(--ink2); border:1px solid var(--line); border-radius:2px; padding:10px 12px}
.sep{height:1px; background:var(--line); margin:12px 0}

/* ---------- title ---------- */
.title-ov{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(120% 90% at 50% 15%,#232a35 0%,#11141a 55%,#080a0e 100%)}
.title-ov::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000f 3px 4px)}
.title-box{position:relative; text-align:center; z-index:1; max-width:520px; padding:20px}
.title-box h1{font-size:var(--fs-xxl); font-weight:800; letter-spacing:.28em; color:var(--brass);
  text-shadow:0 2px 26px #c9a22740}
.title-rule{height:1px; background:linear-gradient(90deg,#0000,var(--brass),#0000); margin:14px 0 8px}
.title-box p{color:var(--muted); font-size:var(--fs-s); letter-spacing:.14em; margin:0 0 26px}
.sizepick{display:flex; gap:8px; justify-content:center; margin:14px 0 22px}
.sizepick button{flex:1; padding:10px 4px; display:flex; flex-direction:column; gap:2px; align-items:center}
.sizepick button.on{border-color:var(--brass); background:#2b2a1e; color:var(--brass)}
.sizepick small{color:var(--muted); font-size:10px}
.title-acts{display:flex; flex-direction:column; gap:8px}
.title-acts [hidden]{display:none}
@media (hover:none){.kb-only{display:none}}
.title-box p.title-help{margin:18px 0 0; font-size:var(--fs-xs); letter-spacing:.06em; color:var(--muted2); line-height:1.8}
.title-acts button{padding:11px; font-size:var(--fs-m); letter-spacing:.2em}

.chron{display:flex; flex-direction:column; gap:3px; overflow-y:auto; padding-right:4px}
.chron .row{display:flex; gap:10px; align-items:baseline; padding:5px 9px; background:#171b23;
  border-left:3px solid var(--line2); border-radius:0 2px 2px 0; font-size:var(--fs-s)}
.chron .row{margin-top:0}
.chron .row .tn{font-family:var(--mono); font-size:var(--fs-xs); color:var(--muted);
  white-space:nowrap; min-width:60px; font-variant-numeric:tabular-nums}
.chron .row.fall{border-left-color:var(--danger)}
.chron .row.end{border-left-color:var(--brass)}
.chron .row.mile{border-left-color:var(--ok)}
.chron .row.event{border-left-color:var(--warn)}
.chron .row.gov{border-left-color:#6f80a4}
.chron .row.war{border-left-color:#8a5a52}
.nbar{height:7px; border-radius:2px; background:#0d1015; overflow:hidden; min-width:56px}
.nbar i{display:block; height:100%}
.dead td{opacity:.45}
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px}
.filters button{padding:4px 10px; font-size:var(--fs-xs)}
.filters button.on{border-color:var(--brass); color:var(--brass); background:#2b2a1e}

/* ---------- 外交の知らせ ---------- */
.dipw{border-top-color:#c9a227}
.dip-line{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:2px}
.dip-nat{flex:1; background:var(--ink2); border:1px solid var(--line); border-radius:3px;
  padding:10px 12px; text-align:center}
.dip-nat b{display:block; font-family:var(--disp); font-size:var(--fs-l); margin-top:3px}
.dip-nat small{color:var(--muted); font-size:var(--fs-xs)}
.dip-arrow{font-size:24px; font-weight:700}
@media (max-width:640px){ .dip-nat b{font-size:var(--fs-m)} .dip-arrow{font-size:19px} }

/* ---------- battle ---------- */
.bt{display:grid; grid-template-columns:1fr 128px 1fr; gap:12px; align-items:start}
.bt-side{background:var(--ink2); border:1px solid var(--line); border-radius:2px; padding:12px 13px}
.bt-side.def{border-color:#4a4436}
.bt-name{font-family:var(--disp); font-size:var(--fs-l); display:flex; align-items:center; gap:7px}
.bt-tot{font-size:26px; font-family:var(--mono); font-variant-numeric:tabular-nums; margin:6px 0 4px}
.bt-rows{display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:var(--fs-s); margin-top:9px}
.bt-rows i{font-style:normal; color:var(--muted)}
.bt-rows b{text-align:right; font-weight:400; font-family:var(--mono); font-variant-numeric:tabular-nums}
.bt-mid{text-align:center; padding-top:26px}
.bt-clash{font-family:var(--disp); font-size:var(--fs-xl); color:var(--brass); letter-spacing:.2em}
.bt-log{height:112px; overflow:hidden; display:flex; flex-direction:column-reverse; gap:2px;
  font-size:var(--fs-xs); color:var(--muted); margin-top:12px; padding-top:8px; border-top:1px solid var(--line)}
.bt-log b{color:var(--warn); font-weight:500}
.flash{animation:fl .35s}
@keyframes fl{0%{background:#c9a22733}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
@media (max-width:900px){
  .stage{grid-template-columns:1fr; grid-template-rows:1fr auto}
  .side{max-height:44vh; border-left:none; border-top:1px solid var(--line)}
  .log{width:min(60vw,300px)}
  .bt{grid-template-columns:1fr; }
  .bt-mid{padding-top:0}
}
/* ---------- スマートフォン ---------- */
@media (pointer:coarse){
  button{padding:8px 12px; min-height:36px}
  .tabs button{min-height:38px}
  .zoombar button{width:42px; height:42px; font-size:19px}
  .rline{padding:8px 6px}
}
@media (max-width:640px){
  :root{--fs-xs:10.5px; --fs-s:12px; --fs-m:13.5px; --fs-l:15.5px; --fs-xl:19px; --fs-xxl:28px}
  .app{width:100vw; max-width:100vw; overflow:hidden}
  .topbar{height:auto; min-height:44px; flex-wrap:wrap; gap:8px; padding:5px 8px; row-gap:5px; min-width:0}
  .tb-title{font-size:var(--fs-m); letter-spacing:.06em; flex:0 0 auto}
  .tb-stats{order:3; width:100%; min-width:0; flex:0 0 auto; gap:11px; padding-bottom:2px}
  .tb-actions{order:2; flex:1 1 100%; min-width:0; display:flex; gap:5px; overflow-x:auto;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; position:relative}
  .tb-title{flex:1 1 auto}
  .lg,#btnRec{display:none}
  .menu .sm-only{display:block}
  .tb-actions::-webkit-scrollbar{display:none}
  .tb-actions button{white-space:nowrap; padding:7px 9px; flex:0 0 auto}
  .tb-actions #natPick{flex:1 1 auto; min-width:80px; max-width:none}
  .tb-actions > :first-child{margin-left:0}
  .tb-actions #btnEnd{position:sticky; right:0; z-index:2; box-shadow:-10px 0 10px -4px #171b23}
  .stage{grid-template-rows:1fr auto; min-width:0}
  .mapwrap{min-width:0}
  .paneltog{display:block; right:8px; bottom:56px}
  .app.side-min .side{max-height:0; padding:0; border-top:none; overflow:hidden}
  .side{max-height:40vh}
  .pn{padding:11px 12px}
  .log{width:min(72vw,280px); font-size:10.5px; max-height:22vh; overflow:hidden; top:8px; left:8px}
  .maptools{right:8px; top:8px}
  .zoombar{right:8px; bottom:8px}
  .ov{padding:0; align-items:stretch}
  .mw,.mw.sm,.mw.md{max-width:100%; width:100%; max-height:100dvh; height:100dvh;

  .ov.dip-ov{padding:14px; align-items:center}
  .ov.dip-ov .mw{height:auto; max-height:90dvh; border-radius:3px;
    border-left:1px solid var(--line2); border-right:1px solid var(--line2)}
  .mb{padding:12px; overflow-x:auto}
  .mb table.stats{min-width:900px}
  .mb th,.mb td{white-space:nowrap}
  .fld input{min-width:0}
  .mf{position:sticky; bottom:0; background:var(--panel)}
  .grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .fld span{width:52px}

}

<div class="app">
  <header class="topbar">
    <div class="tb-title">国盗り年代記</div>
    <div class="tb-stats" id="tbstats"></div>
    <div class="tb-actions">
      <select id="natPick" title="観戦する国を選びます。選ぶと国全体が見える位置に移ります"></select>
      <button id="btnRec" title="年代記と統計（R）">記録</button>
      <button id="btnAuto" title="ターンを続けて進めます（A）">自動<span class="lg">進行</span></button>
      <select id="spdPick" title="自動進行・演出の速さ（[ と ] でも切り替え）">
        <option value="0">遅い</option><option value="1" selected>普通</option><option value="2">速い</option><option value="3">最速</option>
      </select>
      <button id="btnMenu" aria-haspopup="true" aria-expanded="false" title="表示の切り替え・セーブ・デバッグ"><span class="lg">メニュー </span>≡</button>

    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div class="hint" id="hint"></div>
      <div class="tip" id="tip" hidden></div>

      <div class="toast" id="toast"></div>
      <div class="log" id="log"></div>
      <button id="btnPanel" class="paneltog" title="下のパネルを開閉">▼</button>
      <div class="zoombar">
        <button id="zin" title="拡大">＋</button>
        <button id="zout" title="縮小">－</button>
        <button id="zsel" title="選んだ国の全体を表示（C）" disabled>◎</button>

    <aside class="side" id="side"></aside>

</div>

/* ---------- 幾何 ---------- */
function clipHalf(poly, a, b) {
  // a に近い側を残す（a,b の垂直二等分線でクリップ）
  const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
  const side = p => (p[0] - mx) * nx + (p[1] - my) * ny; // <=0 なら a 側
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length], sp = side(P), sq = side(Q);
    if (sp <= 0) out.push(P);
    if ((sp < 0 && sq > 0) || (sp > 0 && sq < 0)) {
      const t = sp / (sp - sq);
      out.push([P[0] + (Q[0] - P[0]) * t, P[1] + (Q[1] - P[1]) * t]);
    }
  }
  return out;
}
const d2 = (x, y, p) => (x - p[0]) ** 2 + (y - p[1]) ** 2;

function buildVoronoi(sites, W, H) {
  const box = [[0, 0], [W, 0], [W, H], [0, H]];
  const polys = sites.map((s, i) => {
    let p = box;
    for (let j = 0; j < sites.length; j++) {
      if (i === j) continue;
      p = clipHalf(p, s, sites[j]);
      if (p.length < 3) break;
    }
    return p;
  });
  const nb = sites.map(() => new Set()), seg = {}, edgeNb = sites.map(() => []);
  for (let i = 0; i < sites.length; i++) {
    const p = polys[i];
    for (let e = 0; e < p.length; e++) {
      const A = p[e], B = p[(e + 1) % p.length];
      const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
      const di = d2(mx, my, sites[i]);
      let best = -1, bd = Infinity;
      for (let j = 0; j < sites.length; j++) {
        if (j === i) continue;
        const dj = d2(mx, my, sites[j]);
        if (dj < bd) { bd = dj; best = j; }
      }
      const shared = best >= 0 && Math.abs(bd - di) < Math.max(1, di) * 1e-6;
      edgeNb[i][e] = shared ? best : -1;
      if (shared) {
        nb[i].add(best); nb[best].add(i);
        seg[i < best ? i + '_' + best : best + '_' + i] = [A, B];
      }
    }
  }
  return { polys, nb, seg, edgeNb };
}

/* ---------- 境界・街道の曲線化 ---------- */
function wobbleEdge(A, B) {
  const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1;
  const n = clamp(Math.round(len / 34), 2, 7);
  const px = -dy / len, py = dx / len;
  const amp = Math.min(17, len * .14);
  const pts = [[A[0], A[1]]];
  let o = 0;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    o = o * .5 + (Math.random() * 2 - 1) * amp;
    const w = o * Math.sin(Math.PI * t);
    pts.push([A[0] + dx * t + px * w, A[1] + dy * t + py * w]);
  }
  pts.push([B[0], B[1]]);
  return pts;
}
const bkey = (a, b) => a < b ? a + '_' + b : b + '_' + a;
/* ---------- 大陸の輪郭（角度→半径の揺らぎ） ---------- */
function makeContinent() {
  const ph = [rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28)];
  const a = [rnd(.11, .19), rnd(.08, .15), rnd(.05, .10), rnd(.03, .07), rnd(.02, .05)];
  const base = rnd(.70, .78);
  return th => clamp(base
    + a[0] * Math.sin(th * 2 + ph[0]) + a[1] * Math.sin(th * 3 + ph[1])
    + a[2] * Math.sin(th * 5 + ph[2]) + a[3] * Math.sin(th * 7 + ph[3])
    + a[4] * Math.sin(th * 11 + ph[4]), .30, .985);
}
function inLand(shape, x, y, W, H) {
  const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
  const q = Math.hypot(dx, dy);
  return q <= shape(Math.atan2(dy, dx));
}
/* いちばん大きな陸の塊だけ残す（離れ小島は海に沈める） */
function keepMainland(keep, nb) {
  const seen = new Array(keep.length).fill(false);
  let best = null;
  for (let i = 0; i < keep.length; i++) {
    if (!keep[i] || seen[i]) continue;
    const q = [i], group = [];
    seen[i] = true;
    for (let h = 0; h < q.length; h++) {
      const cur = q[h]; group.push(cur);
      for (const j of nb[cur]) if (keep[j] && !seen[j]) { seen[j] = true; q.push(j); }
    }
    if (!best || group.length > best.length) best = group;
  }
  if (!best) return keep;
  const ok = new Array(keep.length).fill(false);
  for (const i of best) ok[i] = true;
  return ok;
}

function genMap(size) {
  const SZ = SIZES[size] || SIZES.mid;

  /* --- 海を含む格子を作り、陸地が目標数になるよう細かさを合わせる --- */
  let mult = 1.85, cols = 1, rows = 1, W = 0, H = 0, pts = [], land = [];
  for (let it = 0; it < 9; it++) {
    const M = Math.max(NN * 3, Math.round(N * mult));
    cols = Math.round(Math.sqrt(M * 2.1)); rows = Math.max(3, Math.round(M / cols));
    W = 190 * cols; H = 190 * rows;
    pts = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const cw = W / cols, ch = H / rows;
      pts.push({ x: cw * (c + .5) + rnd(-cw * .32, cw * .32), y: ch * (r + .5) + rnd(-ch * .32, ch * .32) });
    }
    land = pts.map(p => inLand(shape, p.x, p.y, W, H));
    const k = land.reduce((s2, v) => s2 + (v ? 1 : 0), 0);
    if (Math.abs(k - N) <= Math.max(2, N * .03)) break;

        cx.lineWidth = sel ? 3.2 : 1.8; cx.strokeStyle = sel ? '#ffe27a' : 'rgba(22,17,10,.8)'; cx.stroke();

        const tx = tot >= 10000 ? Math.round(tot / 1000) + 'k' : tot >= 1000 ? (tot / 1000).toFixed(1) + 'k' : String(tot);
        cx.lineWidth = 4; cx.strokeStyle = 'rgba(238,230,205,.95)';
        cx.strokeText(tx, 0, 15); cx.fillStyle = INK; cx.fillText(tx, 0, 15);
        if (mine) {
          cx.beginPath(); cx.arc(-22, 12 - H + 8, 9, 0, 7);
          cx.fillStyle = '#1b1f27'; cx.fill();
          cx.lineWidth = 2; cx.strokeStyle = '#f0cf55'; cx.stroke();
          cx.fillStyle = '#f0cf55'; cx.font = '700 11px ui-monospace,monospace';

      cx.fillStyle = NCOL[a.owner]; cx.fill();

      cx.save(); cx.translate(0, -1.5); cx.scale(1.02, 1.02);

      cx.restore();
      // 兵数
      cx.font = '700 11px ui-monospace,monospace'; cx.textAlign = 'center'; cx.textBaseline = 'top';
      const txt = tot >= 10000 ? Math.round(tot / 1000) + 'k' : tot >= 1000 ? (tot / 1000).toFixed(1) + 'k' : String(tot);
      cx.lineWidth = 3.4; cx.strokeStyle = 'rgba(232,222,196,.95)';
      cx.strokeText(txt, 0, ht + 5); cx.fillStyle = INK; cx.fillText(txt, 0, ht + 5);
      if (mine) { // 軍団番号
        cx.beginPath(); cx.arc(-13.5, -13, 7.5, 0, 7);
        cx.fillStyle = '#1b1f27'; cx.fill();
        cx.lineWidth = 1.7; cx.strokeStyle = '#f0cf55'; cx.stroke();
        cx.fillStyle = '#f0cf55'; cx.font = '700 9.5px ui-monospace,monospace';
        cx.textBaseline = 'middle'; cx.fillText(String(a.idx + 1), -13.5, -12.5);
      }
      if (a.path && a.path.length) { // 進軍中
        cx.beginPath(); cx.moveTo(15.5, -6); cx.lineTo(23, -1); cx.lineTo(15.5, 4); cx.closePath();
        cx.fillStyle = mine ? '#f0cf55' : '#efe7d2'; cx.fill();
        cx.lineWidth = 1.4; cx.strokeStyle = '#241d12'; cx.stroke();
      }
      cx.restore();
    });
  }
}

/* ---------- 演出 ---------- */
const FX_MAX = 32;
function pruneFx(now) {
  const n = now || performance.now();
  let w = 0, A = UI.trails;
  for (let i = 0; i < A.length; i++) if (n - A[i].t0 < A[i].dur) A[w++] = A[i];
  A.length = w;
  w = 0; A = UI.flashes;
  for (let i = 0; i < A.length; i++) if (n - A[i].t0 < A[i].dur) A[w++] = A[i];
  A.length = w;
}
function fxOff() { return CFG.cpuDelay <= 0; }   // 早送り中は演出を積まない
function animMove(a, from) {
  if (fxOff()) { a.anim = null; return; }      // 早送り中は演出そのものを作らない
  const now = performance.now();
  a.anim = { from, t0: now, dur: 470 };
  pruneFx(now);
  if (UI.trails.length >= FX_MAX) UI.trails.shift();
  UI.trails.push({ a: from, b: a.at, col: NCOL[a.owner], t0: now, dur: 1100 });
  startAnim();
}
function flashTerr(tid) {
  if (fxOff()) return;
  const now = performance.now();
  pruneFx(now);
  if (UI.flashes.length >= FX_MAX) UI.flashes.shift();
  UI.flashes.push({ tid, t0: now, dur: 950 });
  startAnim();
}
function animLive() {
  if (UI.trails.length || UI.flashes.length) return true;
  for (const na of G.nations) for (const x of na.armies) if (x && x.anim) return true;
  return false;
}
function startAnim() {
  if (UI.raf || !G) return;
  if (!animLive()) return;                     // 動くものが無ければ回さない
  const step = () => {
    UI.raf = null;
    const now = performance.now();
    let live = false;
    for (const na of G.nations) for (const x of na.armies) if (x && x.anim) {
      if (now - x.anim.t0 > x.anim.dur) x.anim = null; else live = true;
    }
    pruneFx(now);
    if (UI.trails.length || UI.flashes.length) live = true;
    draw();
    if (live) UI.raf = requestAnimationFrame(step);
  };
  UI.raf = requestAnimationFrame(step);
}
function focusOn(tid, flash) {
  const t = T(tid);
  UI.view.x = t.x - CW / (2 * UI.view.s);
  UI.view.y = t.y - CH / (2 * UI.view.s);
  clampView();
  if (flash !== false) flashTerr(tid);
  draw();
}

/* ---------- ヒットテスト ---------- */
function nearestTerr(wx, wy) {
  let best = 0, bd = Infinity;
  for (const t of G.terrs) { const d = (t.x - wx) ** 2 + (t.y - wy) ** 2; if (d < bd) { bd = d; best = t.id; } }
  return best;
}
/* クリックした点を含む領地（形で判定。海なら -1） */
let HIT_CX = null;
function terrAt(wx, wy) {
  if (!HIT_CX) HIT_CX = document.createElement('canvas').getContext('2d');
  const GP = geoFor({ x0: wx - 1, y0: wy - 1, x1: wx + 1, y1: wy + 1 });
  if (GP && !HIT_CX.isPointInPath(GP.land, wx, wy, 'evenodd')) return -1;     // 本当の海岸線の外＝海
  for (const t of G.terrs) {
    const bb = terrBounds(t);
    if (wx < bb[0] || wx > bb[2] || wy < bb[1] || wy > bb[3]) continue;
    if (HIT_CX.isPointInPath(cellShape(t), wx, wy)) return t.id;
  }
  return GP ? -1 : nearestTerr(wx, wy);
}
function armyHit(wx, wy) {
  const by = armySlots();
  for (const tid in by) {
    const list = by[tid], t = T(+tid);
    for (let i = 0; i < list.length; i++) {
      const [ox, oy] = slotOff(i), ax = t.x + ox, ay = t.y + oy;
      if (Math.abs(wx - ax) < 22 && wy - ay < 16 && ay - wy < 52) return list[i];
    }
  }
  return null;
}
function roadHit(wx, wy) {
  for (const t of G.terrs) {                 // 拠点のすぐ近くは領地の選択を優先
    if (Math.hypot(wx - t.x, wy - t.y) < 30) return null;
  }
  for (const e of G.edges) {
    const tol = Math.max(10 / UI.view.s, ROAD_H[e.lv] * .55);
    for (let i = 3; i <= 13; i++) {
      const q = roadPointAt(e, e.a, i / 16);
      if (Math.hypot(wx - q[0], wy - q[1]) < tol) return e;
    }
  }
  return null;
}

/* ---------- 入力（マウス／タッチ共通） ---------- */
let drag = null, pinch = null;
const PTR = new Map();
const cvPos = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
const pinchDist = () => { const p = [...PTR.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); };

cv.addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  PTR.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  try { cv.setPointerCapture(ev.pointerId); } catch (e) { }
  if (PTR.size === 2) {                       // 二本指＝ピンチ操作
    pinch = { d: Math.max(1, pinchDist()), s: UI.view.s };
    drag = null; cv.classList.remove('dragging');
    return;
  }
  if (PTR.size > 2) return;
  drag = { x: ev.clientX, y: ev.clientY, moved: false, vx: UI.view.x, vy: UI.view.y, id: ev.pointerId };
});
cv.addEventListener('pointermove', ev => {
  if (PTR.has(ev.pointerId)) PTR.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && PTR.size >= 2) {               // 拡大縮小
    const d = pinchDist();
    if (d > 4) {
      const p = [...PTR.values()], r = cv.getBoundingClientRect();
      zoomAt((pinch.s * d / pinch.d) / UI.view.s,
        (p[0].x + p[1].x) / 2 - r.left, (p[0].y + p[1].y) / 2 - r.top);
    }
    return;
  }
  if (!drag || drag.id !== ev.pointerId) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  const th = ev.pointerType === 'mouse' ? 4 : 9;   // 指は少しぶれるので広めに
  if (Math.abs(dx) + Math.abs(dy) > th) { drag.moved = true; cv.classList.add('dragging'); }
  if (drag.moved) {
    UI.view.x = drag.vx - dx / UI.view.s; UI.view.y = drag.vy - dy / UI.view.s;
    clampView(); draw();
  }
});
/* マウスを載せた領地の名前・持ち主・地形をすぐ横に出す（クリックしなくても分かるように。指の操作では出さない） */
let TIP_T = 0, TIP_ID = -2;
function hoverTip(ev) {
  const tip = $('#tip'); if (!tip) return;
  if (!G || ev.pointerType !== 'mouse' || drag && drag.moved || PTR.size > 1) { tip.hidden = true; TIP_ID = -2; return; }
  const now = performance.now(); if (now - TIP_T < 50) return; TIP_T = now;
  const [sx, sy] = cvPos(ev), [wx, wy] = s2w(sx, sy);
  const id = terrAt(wx, wy);
  if (id < 0) { tip.hidden = true; TIP_ID = -2; return; }
  if (id !== TIP_ID) {
    TIP_ID = id;
    const t = T(id), o = t.owner >= 0 ? NAT(t.owner) : null;
    const ar = armiesAt(id).filter(x => total(x.t) > 0), troops = ar.reduce((s, x) => s + total(x.t), 0);
    tip.innerHTML = `<b>${esc(t.name)}</b>${t.cap ? ' <span style="color:var(--brass)">首都</span>' : ''}
      <div>${o ? `<span style="color:${readableOnDark(o.color)}">${esc(o.name)}</span>` : '無主の地'}・${terrOf(t).n}・${t.type === 'city' ? '都市' : '砦'} 開発${t.dev}・インフラ ${INFRA_N[t.infra || 1]}</div>
      ${ar.length ? `<div>軍 ${ar.map(x => esc(NAT(x.owner).name)).filter((v, i, s) => s.indexOf(v) === i).join('・')} ${fmt(troops)}</div>` : ''}`;
  }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(CW - w - 6, sx + 16) + 'px';
  tip.style.top = Math.min(CH - h - 6, sy + 18) + 'px';
}
cv.addEventListener('pointermove', hoverTip);
cv.addEventListener('pointerleave', () => { const tip = $('#tip'); if (tip) tip.hidden = true; TIP_ID = -2; });
cv.addEventListener('wheel', () => { const tip = $('#tip'); if (tip) tip.hidden = true; TIP_ID = -2; }, { passive: true });
function endPointer(ev) {
  PTR.delete(ev.pointerId);
  try { cv.releasePointerCapture(ev.pointerId); } catch (e) { }
  if (PTR.size < 2) pinch = null;
  if (!drag || drag.id !== ev.pointerId) {
    if (!drag && PTR.size === 1) {            // ピンチ後に残った指で移動を続ける
      const [id, p] = [...PTR.entries()][0];
      drag = { x: p.x, y: p.y, moved: true, vx: UI.view.x, vy: UI.view.y, id };
    }
    return;
  }
  cv.classList.remove('dragging');
  if (!drag.moved) onMapClick(...s2w(...cvPos(ev)));
  drag = null;
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('contextmenu', ev => ev.preventDefault());
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const [sx, sy] = cvPos(ev);
  zoomAt(ev.deltaY < 0 ? 1.15 : 1 / 1.15, sx, sy);

/* 領地推移のグラフ（線は国色、線端に国名を直接表示） */
function histChart() {
  const H = G.hist || [];
  if (H.length < 2) return `<div class="card" style="color:var(--muted);font-size:var(--fs-s)">
    領地の推移はターンを進めると記録されます。</div>`;
  const many = G.nations.length > 6;
  const W = 700, HT = many ? 300 : 220, PL = 30, PR = 104, PT = 14, PB = 26;
  const t0 = H[0].t, t1 = H[H.length - 1].t;
  let peak = 1;
  for (const h of H) for (const v of h.o) if (v > peak) peak = v;
  const step = [1, 2, 5, 10, 20, 25, 50].find(s => peak / s <= 4) || 100;
  const maxY = Math.max(step * 2, Math.ceil(peak / step) * step);
  const X = t => PL + (t - t0) / Math.max(1, t1 - t0) * (W - PL - PR);
  const Y = v => PT + (1 - v / maxY) * (HT - PT - PB);
  let g = '';
  for (let v = 0; v <= maxY; v += step) {   // 目盛り
    const y = Y(v);
    g += `<line x1="${PL}" y1="${y}" x2="${W - PR}" y2="${y}" stroke="#39414f" stroke-width="1" opacity=".7"/>
      <text x="${PL - 6}" y="${y + 4}" text-anchor="end" fill="#9b9484" font-size="10">${v}</text>`;
  }
  const ticks = [t0, Math.round((t0 + t1) / 2), t1];
  for (const t of ticks) g += `<text x="${X(t)}" y="${HT - 8}" text-anchor="middle" fill="#9b9484" font-size="10">${t}T</text>`;
  const ends = [];
  G.nations.forEach(n => {
    const pts = H.map(h => `${X(h.t).toFixed(1)},${Y(h.o[n.id]).toFixed(1)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="${n.color}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round" opacity="${n.alive ? 1 : .45}"/>`;
    ends.push({ n, y: Y(H[H.length - 1].o[n.id]), v: H[H.length - 1].o[n.id] });
  });
  // 直接ラベル：国が多い時は上位だけに絞り、重なりをずらす
  const show = ends.slice().sort((a, b) => b.v - a.v).slice(0, many ? 8 : ends.length);
  const lab = ends.filter(e => show.includes(e));
  lab.sort((a, b) => a.y - b.y);
  const gap = many ? 12 : 13;
  for (let i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < gap) lab[i].y = lab[i - 1].y + gap;
  const over = lab.length ? lab[lab.length - 1].y - (HT - PB + 4) : 0;
  if (over > 0) for (const e of lab) e.y -= over;
  for (const e of lab) {
    g += `<text x="${W - PR + 8}" y="${e.y + 4}" fill="${e.n.color}" font-size="${many ? 10 : 11}"
      opacity="${e.n.alive ? 1 : .5}">${esc(e.n.name.slice(0, 5))} ${e.v}</text>`;
  }
  if (lab.length < ends.length)
    g += `<text x="${W - PR + 8}" y="${(lab.length ? lab[lab.length - 1].y : PT) + 17}" fill="#9b9484"
      font-size="10">ほか ${ends.length - lab.length}国</text>`;
  return `<div class="card" style="padding:8px 10px">
    <div class="lbl">領地数の推移（縦：領地数 ／ 横：ターン）</div>
    <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${HT}" width="100%" height="${HT}" role="img"
      aria-label="各国の領地数の推移">${g}</svg></div></div>`;
}

  // 最大軍団

}

function openRecord(tab) {
  if (tab) recTab = tab;
  const body = `<div class="tabs">
      <button data-rt="chron" class="${recTab === 'chron' ? 'on' : ''}">年代記</button>
      <button data-rt="stats" class="${recTab === 'stats' ? 'on' : ''}">統計</button>
    </div>${recTab === 'chron' ? chronPanel() : statsPanel()}`;
  const d = modal('記録', body, `<button data-close>閉じる</button>`, recTab === 'stats' ? 'wide' : '');
  $$('[data-rt]', d).forEach(b => b.onclick = () => openRecord(b.dataset.rt));
  $$('[data-cf]', d).forEach(b => b.onclick = () => { chronFilter = b.dataset.cf; openRecord('chron'); });
  $$('[data-cn]', d).forEach(b => b.onclick = () => { chronNation = +b.dataset.cn; openRecord('chron'); });
  $$('[data-cnsel]', d).forEach(s => s.onchange = () => { chronNation = +s.value; openRecord('chron'); });
  $$('[data-sk]', d).forEach(th => th.onclick = () => { STAT_SORT = th.dataset.sk; openRecord('stats'); });   // 見出しを押すと並べ替え
  $$('[data-srow]', d).forEach(tr => tr.onclick = () => { const n = +tr.dataset.srow; if (!NAT(n).alive) return; closeModal(); selectNation(n, true); });
}

function onMapClick(wx, wy) {
  if (G.observer) {                  // 観戦中：クリックした場所の国（県）全体を選ぶ
    const a2 = armyHit(wx, wy), t2 = a2 ? a2.at : terrAt(wx, wy);
    if (t2 < 0) { UI.sel = null; selectNation(null, false); return; }     // 海をクリック：選択を外す
    const nid = a2 ? a2.owner : T(t2).owner;
    UI.lastTile = t2;                // デバッグで「選択中の領地」に使う（表示は国全体のまま）
    UI.sel = nid >= 0 ? null : t2;   // 無主の地だけは土地の情報を出す
    UI.selArmy = null; UI.selRoad = null;
    selectNation(nid >= 0 ? nid : null, nid >= 0 && nid === UI.selNat);   // 選んでいる国をもう一度押すと、その国の全体を表示
    return;
  }
  if (UI.busy) {                     // CPUの手番や自動進行中でも「見る」操作はできる
    const a2 = armyHit(wx, wy);
    if (a2) { UI.selArmy = a2; UI.sel = a2.at; UI.selRoad = null; UI.selNat = a2.owner; }
    else {
      const t2 = nearestTerr(wx, wy);
      UI.sel = t2; UI.selRoad = null; UI.selNat = T(t2).owner >= 0 ? T(t2).owner : null; UI.selArmy = null;
    }
    renderSide(); draw(); return;
  }
  const a = armyHit(wx, wy);
  if (a) { UI.selArmy = a; UI.sel = a.at; UI.selRoad = null; UI.selNat = a.owner; renderSide(); draw(); return; }
  const e = roadHit(wx, wy);
  if (e) { UI.selRoad = e; UI.selArmy = null; renderSide(); draw(); return; }
  const t = nearestTerr(wx, wy);
  UI.sel = t; UI.selRoad = null; UI.selNat = T(t).owner >= 0 ? T(t).owner : null;
  const here = armiesAt(t).filter(x => x.owner === 0);
  UI.selArmy = here.length === 1 ? here[0] : (UI.selArmy && UI.selArmy.at === t ? UI.selArmy : null);
  renderSide(); draw();
}

/* 観戦する国を選ぶ（frame=true なら国全体が見える位置へ） */
function selectNation(nid, frame) {
  UI.selNat = nid; UI.sel = nid != null ? null : UI.sel; UI.selArmy = null; UI.selRoad = null;
  if (nid != null && frame) frameNation(nid);
  syncNatPick(); renderTop(); renderSide(); renderLog(); draw();
  $('#zsel').disabled = UI.selNat == null;
}
function frameNation(nid) {
  const o = natShapes()[nid];
  if (!o || !o.n || !o.mbb) return;
  const [x0, y0, x1, y1] = o.mbb, m = 60;
  const s = clamp(Math.min(CW / (x1 - x0 + 2 * m), CH / (y1 - y0 + 2 * m)), Math.min(CW / G.W, CH / G.H) * .5, 1.2);
  UI.view.s = s;
  UI.view.x = (x0 + x1) / 2 - CW / (2 * s); UI.view.y = (y0 + y1) / 2 - CH / (2 * s);
  clampView();
}
let NATPICK_KEY = '';
function syncNatPick() {
  const el = $('#natPick'); if (!el || !G) return;
  const cnt = new Array(G.nations.length).fill(0);
  for (const t of G.terrs) if (t.owner >= 0) cnt[t.owner]++;
  const key = G.nations.map(n => n.alive ? cnt[n.id] : '-').join(',');
  if (key !== NATPICK_KEY && document.activeElement !== el) {   // 開いている最中は作り直さない（自動進行中に閉じてしまうため）
    NATPICK_KEY = key;
    const opt = n => `<option value="${n.id}"${n.alive ? '' : ' disabled'}>${esc(n.name)}${n.alive ? `（${cnt[n.id]}）` : '（滅亡）'}</option>`;
    const jp = G.size === 'japan' && G.nations.length === 47 && G.nations[0].name === JP_PREFS[0][0];
    const REG = [['北海道・東北', 0, 6], ['関東', 7, 13], ['中部', 14, 22], ['近畿', 23, 29], ['中国', 30, 34], ['四国', 35, 38], ['九州・沖縄', 39, 46]];
    el.innerHTML = '<option value="">国を選ぶ…</option>' + (jp
      ? REG.map(([nm, a, b]) => `<optgroup label="${nm}">${G.nations.slice(a, b + 1).map(opt).join('')}</optgroup>`).join('')   // 日本は地方ごとに
      : G.nations.map(opt).join(''));
  }
  el.value = UI.selNat != null && UI.selNat >= 0 ? String(UI.selNat) : '';
}
/* 関わっている戦争：陣営・主戦国か加勢か・戦いぶり（土地の分け前の割合） */

function natPanel(nid) {
  const na = NAT(nid);

  });
  const order = { war: 0, tense: 1, lord: 2, vassal: 3, ally: 4, peace: 5 };
  rels.sort((a, b) => order[a.st] - order[b.st] || b.f - a.f);

    const list = rels.filter(r => r.st === key);

  const thr = Math.round(threatOf(nid)), top = topThreat();
  return `<div class="pn">
    <div class="pn-h"><h3 style="color:${readableOnDark(na.color)}">${esc(na.name)}</h3>

      ${facOf(nid) ? `<dt>陣営</dt><dd><b style="color:#b9a2e6">${esc(facOf(nid).name)}</b>　盟主 ${esc(NAT(facOf(nid).leader).name)}<div style="color:var(--muted);font-size:var(--fs-xs)">加盟：${facOf(nid).members.map(m => esc(NAT(m).name)).join('、')}</div></dd>` : ''}
      ${!na.alive && na.rebel ? `<dt>旧領の不満</dt><dd>${Math.round(na.rebel)} / ${REB.need}（溜まると旧領で蜂起）</dd>` : ''}
      <dt>インフラ</dt><dd>${own.length ? `平均 ${(own.reduce((a, t) => a + (t.infra || 1), 0) / own.length).toFixed(1)}　<span style="color:var(--muted);font-size:var(--fs-xs)">主要街道 ${own.filter(t => (t.infra || 1) >= 3).length}・整った ${own.filter(t => t.infra === 2).length}・乏しい ${own.filter(t => (t.infra || 1) <= 1).length}</span>` : '—'}</dd>
      <dt>国力</dt><dd>${fmt(nationPower(nid))}</dd>
      <dt>総兵力</dt><dd>${fmt(nationTroops(nid))}</dd>
      <dt>人口</dt><dd>${fmt(own.reduce((a, t) => a + t.pop, 0))}</dd>
      <dt>脅威度</dt><dd style="color:${threatColor(thr)}">${thr}　${threatLabel(thr)}</dd>

/* 何も選んでいない時：天下の情勢（大きな国・戦争・陣営）。名前を押すとその国を選ぶ */
/* この10ターンほどの領地の増減（記録の推移から） */
function ownDelta(nid, now) {
  const H = G.hist || []; if (!H.length) return 0;
  let h = H[0];
  for (let i = H.length - 1; i >= 0; i--) if (G.turn - H[i].t >= 10) { h = H[i]; break; }
  return now - (h.o[nid] || 0);
}
const deltaTag = d => d > 0 ? `<span style="color:var(--ok);font-size:var(--fs-xs)">▲${d}</span>` : d < 0 ? `<span style="color:var(--danger);font-size:var(--fs-xs)">▼${-d}</span>` : '';
function worldPanel() {
  const cnt = new Map();
  for (const t of G.terrs) if (t.owner >= 0) cnt.set(t.owner, (cnt.get(t.owner) || 0) + 1);
  const alive = G.nations.filter(n => n.alive).sort((a, b) => (cnt.get(b.id) || 0) - (cnt.get(a.id) || 0));
  const max = Math.max(1, ...alive.map(n => cnt.get(n.id) || 0));
  const nm = n => `<span class="wl" data-nat="${n}" style="color:${readableOnDark(NAT(n).color)}">${esc(NAT(n).name)}</span>`;
  const rank = alive.slice(0, 10).map((n, i) => `<div class="wrank" data-nat="${n.id}">
      <span class="wno">${i + 1}</span><span class="dot" style="background:${n.color}"></span><b>${esc(n.name)}</b>
      <span class="nbar" style="flex:1"><i style="width:${Math.round((cnt.get(n.id) || 0) / max * 100)}%;background:${n.color}"></i></span>
      <span class="num">${cnt.get(n.id) || 0}</span><span class="wd">${deltaTag(ownDelta(n.id, cnt.get(n.id) || 0))}</span></div>`).join('');
  const wars = G.wars ? Object.values(G.wars) : [];
  const warH = wars.length ? wars.slice(0, 8).map(W => `<div class="wline">${nm(W.a)} 陣営 <span style="color:var(--danger)">対</span> ${nm(W.b)} 陣営
      <span style="color:var(--muted);font-size:var(--fs-xs)">（${G.turn - (W.t0 || G.turn)}ターン目・${W.sA.length + W.sB.length}か国）</span></div>`).join('')
    + (wars.length > 8 ? `<div class="wline" style="color:var(--muted)">ほか ${wars.length - 8} 件</div>` : '')
    : '<div class="wline" style="color:var(--muted)">いまは戦争がありません</div>';
  const facs = G.factions ? Object.values(G.factions).filter(F => F && F.members && F.members.some(m => NAT(m).alive)) : [];
  const facH = facs.length ? facs.map(F => `<div class="wline"><b style="color:#b9a2e6">${esc(F.name)}</b>　盟主 ${nm(F.leader)}
      <span style="color:var(--muted);font-size:var(--fs-xs)">（${F.members.filter(m => NAT(m).alive).length}か国）</span></div>`).join('')
    : '<div class="wline" style="color:var(--muted)">まだ陣営はありません</div>';
  return `<div class="pn"><div class="pn-h"><h3>天下の情勢</h3><span class="chip">${G.turn}ターン目</span></div>
      <div class="lbl" style="margin:2px 0 4px">領地の多い国 <span style="letter-spacing:0;text-transform:none">（▲▼＝この10ターンの増減）</span></div>${rank}
      ${alive.length > 10 ? `<div style="color:var(--muted);font-size:var(--fs-xs);margin-top:4px">ほか ${alive.length - 10} か国</div>` : ''}
      <div class="lbl" style="margin:12px 0 4px">戦争</div>${warH}
      <div class="lbl" style="margin:12px 0 4px">陣営</div>${facH}
    </div>
    <div class="side-empty" style="padding-top:12px">国の名前か地図の国を押すと、その国の全体と情報が表示されます。選んだ国に関わる戦いや外交だけが知らされます。<br>キー操作は「?」で確認できます。</div>`;
}
function renderSide() {
  const s = $('#side');
  if (!G) { s.innerHTML = ''; return; }
  refreshSupply();
  let h = '';
  if (UI.selNat != null && (UI.mapMode === 'pol' || UI.sel == null)) h += natPanel(UI.selNat);
  if (UI.selRoad) h += roadPanel(UI.selRoad);
  if (UI.selArmy) h += armyPanel(UI.selArmy);
  if (UI.sel != null) h += terrPanel(T(UI.sel));
  if (UI.selNat != null && UI.mapMode !== 'pol' && UI.sel != null) h += natPanel(UI.selNat);
  if (!h) h = G.observer
    ? worldPanel()
    : `<div class="side-empty">地図の領地・道路・軍団をクリックすると情報が表示されます。<br><br>
    ドラッグで移動、ホイールで拡大縮小。</div>`;

  startAnim();
}

        <span style="color:var(--muted);font-size:var(--fs-xs)">${PERSONA[na.persona] ? PERSONA[na.persona].n : ''}</span>` : ''}</div>
    ${!mine && !G.observer && relState(0, t.owner) !== 'war' ? `<div style="color:var(--muted);font-size:var(--fs-xs);margin:-4px 0 8px">
      ${canPass(0, t.owner) ? '通行許可あり（通過はできますが占領はできません）' : '平和状態のため進軍できません'}</div>` : ''}
    <dl class="kv">
      <dt>開発度</dt><dd>${t.dev} / 5${t.devP ? ' <span style="color:var(--brass)">(次T +1)</span>' : ''}</dd>
      <dt>建物枠</dt><dd>${t.bld.filter(Boolean).length} / ${t.dev}</dd>
      <dt>人口</dt><dd>${fmt(t.pop)} <span style="color:var(--muted)">/ ${fmt(cap)}</span></dd>
      <dt>徴兵の余力</dt><dd>${fmt(levyRoom(t))} <span style="color:var(--muted);font-size:var(--fs-xs)">（人口の${Math.round(CFG.levyFloor * 100)}%は徴兵に回りません）</span></dd>
      <dt>治安</dt><dd><span style="color:${secColor(t.sec)}">${Math.round(t.sec)}　${secLabel(t.sec)}</span></dd>
      ${t.type === 'fort' ? `<dt>防御補正</dt><dd>+${Math.round((fortMul(t) - 1) * 100)}%</dd>`
      : `<dt>毎ターン収入</dt><dd>${fmt(income)} G</dd>`}
      <dt>インフラ</dt><dd>${t.infra || 1}　${INFRA_N[t.infra || 1]}${t.infraP ? ' <span style="color:var(--brass)">(次T +1)</span>' : ''}${t.infraBroke ? ` <span style="color:var(--warn)">崩落 あと${t.infraBroke}T</span>` : ''}
        ${t.link ? (lb ? ` <span style="color:var(--ok)">収入 +${Math.round(lb * 100)}%</span>` : '') : ' <span style="color:var(--danger)">首都と繋がっていません</span>'}</dd>
      <dt>入るのに</dt><dd>${G.terrs.length ? stepCost(t.id) : 1} ターン <span style="color:var(--muted);font-size:var(--fs-xs)">（${terrOf(t).n}・インフラ${t.infra || 1}）</span></dd>
      ${t.chaos > 0 ? `<dt style="color:var(--warn)">混乱</dt><dd style="color:var(--warn)">
        あと${t.chaos}ターン（生産${Math.round(CFG.chaosMul * 100)}%）</dd>` : ''}
      ${t.siege ? `<dt style="color:var(--danger)">包囲</dt><dd style="color:var(--danger)">

    </dl>
    <div class="nbar" style="margin:-4px 0 10px"><i style="background:${secColor(t.sec)};width:${Math.round(t.sec)}%"></i></div>
    <div class="slots">${slots.join('')}</div>
    ${mine && !G.observer ? `<div class="row">
      <button data-act="dev" ${t.dev >= 5 || t.devP || PL().gold < dcost ? 'disabled' : ''}>開発度上昇 (${t.dev >= 5 ? '最大' : fmt(dcost) + 'G'})</button>
      <button data-act="rename">改名</button>
      ${!t.cap && t.type === 'city' ? '<button data-act="cap">首都に指定</button>' : ''}</div>` : ''}
    ${gar.length ? `<div class="lbl" style="margin-top:12px">駐留軍団</div>${gar.map(a => armyLine(a)).join('')}` : '<div class="lbl" style="margin-top:12px">駐留軍団なし</div>'}
  </div>`;
}

      <dt>総兵数</dt><dd><b>${fmt(s.tot)}</b></dd>

function roadPanel(e) {

      <dt>拡張費用</dt><dd>${e.lv >= 3 ? '—' : fmt(ROAD_COST[e.lv]) + ' G'}</dd>
    </dl>

      ${!ownRoad(e) ? '自国に接していません' : e.lv >= 3 ? '最大Lv' : e.pend ? '拡張予約済（次ターン反映）' : 'Lv' + (e.lv + 1) + 'へ拡張'}</button>
      <button data-act="bulk">範囲選択で一括拡張</button></div>
    ${!ownRoad(e) ? '<div style="color:var(--muted);font-size:var(--fs-xs);margin-top:7px">拡張できるのは、片側が自国の領地である街道だけです。</div>'
      : a.owner !== b.owner ? '<div style="color:var(--muted);font-size:var(--fs-xs);margin-top:7px">国境の街道です。拡張すると敵軍の通行も楽になります。</div>' : ''}
  </div>`;
}

function bindSide() {
  $$('#side [data-army]').forEach(el => el.onclick = () => {
    const [o, i] = el.dataset.army.split('_').map(Number);
    UI.selArmy = NAT(o).armies[i]; renderSide(); draw();
  });
  $$('#side [data-jump]').forEach(el => el.onclick = () => {
    const a = PL().armies[+el.dataset.jump];
    if (!a) return;
    UI.selArmy = a; UI.sel = a.at; UI.selRoad = null;
    focusOn(a.at); renderSide();
  });
  $$('#side [data-nat]').forEach(el => el.onclick = () => selectNation(+el.dataset.nat, G.observer));
  $$('#side details[data-fold]').forEach(el => el.ontoggle = () => { UI.peaceOpen = el.open; });
  $$('#side [data-raze]').forEach(el => el.onclick = () => {
    if (UI.busy) { notify('ターンの処理中です', 'err'); return; }
    const t = T(UI.sel), i = +el.dataset.raze, k = t.bld[i];
    if (!k) return;
    modalConfirm(`${BLD[k].n} を取り壊す`, `${esc(t.name)} の ${BLD[k].n} を取り壊します。費用は戻りません。`, () => {
      t.bld[i] = null; invalidateTerr(t.id); refresh();
      logMsg(`${t.name} の ${BLD[k].n} を取り壊しました`);
    });
  });
  $$('#side [data-act]').forEach(el => el.onclick = () => {
    const t = UI.sel != null ? T(UI.sel) : null, a = UI.selArmy;
    if (el.dataset.act === 'natframe') { if (UI.selNat != null) { frameNation(UI.selNat); draw(); } return; }
    if (el.dataset.act === 'natclear') { selectNation(null, false); return; }
    const view = el.dataset.act === 'natjump';
    if (UI.busy && !view) { notify('ターンの処理中です', 'err'); return; }
    switch (el.dataset.act) {
      case 'dev': {
        const c = DEV_COST[t.dev];
        if (PL().gold < c) return;
        PL().gold -= c; t.devP = true; logMsg(`${t.name} の開発を開始（次ターン反映）`); break;
      }
      case 'rename': promptModal('名称の変更', t.name, v => { t.name = v; LBL_HID = null; invalidateMap(); refresh(); }); return;
      case 'road': {
        const e = UI.selRoad, c = ROAD_COST[e.lv];
        if (PL().gold < c) return;
        PL().gold -= c; e.pend = true;
        notify(`${T(e.a).name}—${T(e.b).name} の街道をLv${e.lv + 1}へ拡張します（次ターン反映）`, 'good'); break;
      }
      case 'move':
        UI.moveMode = a; hint(`${a.name}（${fmt(total(a.t))}）の進軍先をクリック　右クリック/Escで中止`);
        cv.classList.add('targeting'); return;

      case 'cap': setCapital(0, t.id); break;
      case 'settle':
        if (!startSettle(0, t.id)) { notify(settleReason(0, t.id) || '開拓できません', 'err'); return; }
        break;
      case 'natjump': {
        const na = NAT(UI.selNat);
        if (na) { const cid = T(na.capital).owner === na.id ? na.capital : (G.terrs.find(x => x.owner === na.id) || {}).id;
          if (cid != null) focusOn(cid); }
        return;
      }
      case 'stop': a.path = []; break;
    }
    refresh();
  });
}
function refresh() {
  if (G && G.observer && UI.selNat != null && NAT(UI.selNat) && !NAT(UI.selNat).alive) UI.selNat = null;   // 滅んだ国の選択は外す
  syncNatPick(); renderTop(); renderSide(); renderLog(); draw();
}
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- モーダル基盤 ---------- */
function modal(title, body, foot, cls) {
  closeModal();
  const d = document.createElement('div');
  d.className = 'ov';
  d.innerHTML = `<div class="mw ${cls || ''}"><div class="mh"><h2>${esc(title)}</h2>
    <button class="x" data-close>閉じる</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  d.addEventListener('mousedown', ev => { if (ev.target === d) closeModal(); });
  $$('[data-close]', d).forEach(b => b.onclick = closeModal);
  $('#modals').appendChild(d);

/* ---------- 軍団編成 ---------- */
let armyTab = 0;
function reinforce(a) {
  const p = NAT(a.owner);
  if (T(a.at).owner !== a.owner) return;
  TK.forEach(k => {
    const need = Math.max(0, a.target[k] - a.t[k]);
    const give = Math.min(need, p.stock[k]);
    a.t[k] += give; p.stock[k] -= give;
  });
}

/* ---------- 将軍 ---------- */
function genDesc(g) {
  const s = [];
  if (g.pts.atk) s.push('攻+' + g.pts.atk * 5 + '%');
  if (g.pts.def) s.push('防+' + g.pts.def * 5 + '%');
  if (g.pts.chg) s.push('突+' + g.pts.chg * 3 + '%');
  for (const k of TK) if (g.pts[k]) s.push(TROOP[k].n + '+' + g.pts[k] * 8 + '%');
  return s.join(' ') || '—';
}
/* ============================================================
   進軍・戦闘・占領
   ============================================================ */
const cpuOdds = nid => G.observer || nid !== 0;      // CPUは勝ち目を見てから攻める
async function advanceArmy(a) {
  if (a.moved || !a.path.length || total(a.t) <= 0) return;
  const next = a.path[0], e = edgeBetween(a.at, next), from = a.at;
  if (!e) {                               // 隣り合っていない
    if (a.owner === 0 && !G.observer) notify(`${a.name} は ${T(next).name} へ進めません（隣り合っていません）`, 'err');
    a.path = []; return;
  }
  const t = T(next);
  if (!canEnter(a.owner, next)) {        // 外交上入れない
    if (a.owner === 0 && !G.observer) notify(`${a.name} は進めません：${enterReason(0, next)}`, 'err');
    a.path = []; return;
  }
  a.moved = true;
  // 地形とインフラで何ターンかかるか：着くまでは途中を進むだけ
  if (a.prog !== next) { a.prog = next; a.progN = 0; }
  a.progN = (a.progN || 0) + 1;
  const need = stepCost(next, e);
  if (a.progN < need) {
    if (a.owner === 0 && !G.observer) notify(`${a.name} は${terrOf(t).n}の ${t.name} へ進軍中（あと${need - a.progN}ターン）`);
    return;
  }
  a.prog = null; a.progN = 0;
  if (!canOccupy(a.owner, next)) {       // 自国領・通行許可のある領地を通過する
    const foes = armiesAt(next).filter(x => total(x.t) > 0 && atWar(x.owner, a.owner));
    if (foes.length) {
      if (cpuOdds(a.owner) && powerOf([a], t, false) < powerOf(foes, t, true) * .9) { a.path = []; return; }   // 勝ち目のない戦いは避けて待つ
      const r = await runBattle(a, foes, t);
      invalidateSupply();
      if (r !== 'A') { a.path = []; return; }
    }
    a.at = next; a.path.shift(); animMove(a, from); invalidateSupply();
    if (a.owner === 0 && !G.observer && !a.path.length) notify(`${a.name} が ${t.name} に到着しました`, 'good');
    return;
  }
  const def = armiesAt(next).filter(x => total(x.t) > 0 && atWar(x.owner, a.owner));
  if (!def.length) {
    capture(next, a.owner, a);
    a.at = next; a.path.shift(); animMove(a, from);
    return;
  }
  // 砦へは強襲か包囲かを選ぶ
  if (t.type === 'fort') {
    const mode = cpuSiegeChoice(a, t, def);
    if (mode === 'siege') { startSiege(a, t, from); return; }
    UI.assault = true;
  }
  // 同じ領地にいる味方軍団を戦闘に加える
  let mates = joinCandidates(a, from, next, e);
  if (mates.length) {
    mates = cpuJoiners(a, mates, def, t);
  }
  const force = [a].concat(mates);
  if (cpuOdds(a.owner) && powerOf(force, t, false) < powerOf(def, t, true) * .9) {   // 勝ち目がなければ攻めずに待つ（援軍を待つ）
    UI.assault = false; a.path = []; return;
  }
  for (const m of mates) { m.moved = true; m.path = []; }
  const res = await runBattle(force, def, t);
  UI.assault = false;
  const alive = force.filter(x => total(x.t) > 0);
  if (res === 'A') {
    capture(next, a.owner, a);
    for (const x of alive) { const f2 = x.at; x.at = next; animMove(x, f2); }
    a.path.shift();
  } else { a.path = []; }
  invalidateSupply();
}

/* ---------- 攻城戦 ---------- */
function startSiege(a, t, from) {
  const mates = armiesAt(from).filter(x => x.owner === a.owner && total(x.t) > 0 && (x === a || !x.moved));
  for (const x of mates) { x.moved = true; x.path = []; x.siege = t.id; }
  t.siege = { by: a.owner, t0: G.turn };
  a.path = [];
  const msg = `${NAT(a.owner).name} が ${t.name} を包囲した（${CFG.siegeTurns}ターンで陥落）`;
  logWar(msg, [a.owner, t.owner], 'war'); chron(msg, a.owner, 'fall');
  if (a.owner === 0 && !G.observer) notify(msg, 'good');
  else if (T(t.id).owner === 0 && !G.observer) notify(`${t.name} が包囲されました`, 'err');
  refresh();
}
function siegeArmies(t) {                 // その砦を包囲している軍団
  if (!t.siege) return [];
  const out = [];
  for (const { to } of roadNbrs(t.id))
    for (const x of armiesAt(to))
      if (x.owner === t.siege.by && x.siege === t.id && total(x.t) > 0) out.push(x);
  return out;
}
function siegeTurn() {                    // 毎ターンの包囲処理
  for (const t of G.terrs) {
    if (!t.siege) continue;
    const by = t.siege.by;
    if (!NAT(by) || !NAT(by).alive || !atWar(by, t.owner)) { liftSiege(t, '戦いが終わった'); continue; }
    const force = siegeArmies(t);
    if (!force.length) { liftSiege(t, '包囲軍が去った'); continue; }
    const gar = armiesAt(t.id).filter(x => total(x.t) > 0);
    for (const g of gar) for (const k of TK) g.t[k] = Math.max(0, Math.round(g.t[k] * (1 - CFG.siegeBleed)));
    t.sec = clamp(t.sec - CFG.siegeSec, 0, 100);
    const tot = force.reduce((s, x) => s + total(x.t), 0);
    NAT(by).food -= Math.round(tot / 1000 * CFG.siegeFood);     // 包囲は兵糧を食う
    destroyDead(gar);
    const left = armiesAt(t.id).filter(x => total(x.t) > 0);
    const over = (G.turn - t.siege.t0) >= CFG.siegeTurns - 1;      // 包囲を始めたターンも数える
    if (!left.length || over) {                                  // 陥落
      const lead = force[0];
      const old = t.owner;
      capture(t.id, by, lead);
      for (const x of left) { for (const k of TK) x.t[k] = 0; }
      destroyDead(left);
      lead.at = t.id;
      for (const x of force) x.siege = null;
      t.siege = null;
      const msg = `${t.name} が包囲の末に陥落（${NAT(old).name} → ${NAT(by).name}）`;
      logWar(msg, [old, by], 'war'); chron(msg, by, 'fall');
      invalidateSupply();
    }
  }
}
function liftSiege(t, why) {
  if (!t.siege) return;
  for (const na of G.nations) for (const x of na.armies) if (x && x.siege === t.id) x.siege = null;
  const msg = `${t.name} の包囲が解かれた（${why}）`;
  logWar(msg, [t.owner, t.siege.by]); chron(msg, t.owner, 'gov');
  t.siege = null;
}
function cpuSiegeChoice(a, t, def) {      // CPU：勝てそうなら強襲、厳しければ包囲
  const mine = powerOf([a].concat(armiesAt(a.at).filter(x => x !== a && x.owner === a.owner && !x.moved)), t, false);
  const dp = powerOf(def, t, true);
  if (mine >= dp * 1.6) return 'assault';
  if (NAT(a.owner).food < 1500) return 'assault';
  return 'siege';
}
/* 同じ領地から一緒に攻められる味方軍団 */
function joinCandidates(a, from, next, e) {
  const cap = ROAD_CAP[e.lv];
  let load = total(a.t);
  const list = [];
  for (const x of armiesAt(from)) {
    if (x === a || x.owner !== a.owner || x.moved || total(x.t) <= 0) continue;
    if (total(x.t) > cap || load + total(x.t) > cap) continue;    // 街道の通行量を超えない
    load += total(x.t);
    list.push(x);
  }
  return list;
}
function cpuJoiners(a, mates, defs, t) {          // CPUは勝てるだけ連れて行く
  const need = powerOf(defs, t, true) * 1.15;
  const out = [];
  let mine = powerOf([a], t, false);
  for (const m of mates) {
    if (mine >= need) break;
    out.push(m); mine = powerOf([a].concat(out), t, false);
  }
  return out;
}
/* ---------- 占領 ---------- */
function capture(tid, nid, byArmy) {

}

function checkNations() {

/* ---------- 戦闘計算 ---------- */
function sideStats(list, t, isDef) {
  let tot = 0, atk = 0, def = 0, chg = 0;
  for (const a of list) {
    const s = armyStats(a);
    tot += s.tot; atk += s.atk * s.tot; def += s.def * s.tot; chg += s.chg * s.tot;
  }
  if (!tot) return { tot: 0, atk: 0, def: 0, chg: 0 };
  atk /= tot; def /= tot; chg /= tot;
  if (isDef) def *= fortMul(t);
  return { tot, atk, def, chg };
}
function applyLoss(list, amount) {
  let tot = list.reduce((s, a) => s + total(a.t), 0);
  if (tot <= 0) return;
  amount = Math.min(amount, tot);
  for (const a of list) {
    const at = total(a.t); if (at <= 0) continue;
    let share = amount * at / tot;
    for (const k of TK) {
      if (!a.t[k]) continue;
      a.t[k] = Math.max(0, a.t[k] - share * (a.t[k] / at));
    }
  }
}
function battleTick(A, D, t) {
  const sa = sideStats(A, t, false), sd = sideStats(D, t, true);
  if (!sa.tot || !sd.tot) return null;
  const ca = Math.random() < sa.chg, cd = Math.random() < sd.chg;
  // 与える損害 = 自軍兵数^n × 敵兵数^(1-n) × 攻撃力 ÷ 敵防御力 × 係数
  //   n=CFG.sizeExp。n が大きいほど、兵数の多い側が受ける損害が相対的に小さくなる
  const n = CFG.sizeExp, m = 1 - n;
  const powA = Math.pow(sa.tot, n) * Math.pow(sd.tot, m);
  const powD = Math.pow(sd.tot, n) * Math.pow(sa.tot, m);
  const dToD = powA * CFG.dmgK * (sa.atk / (sd.def * (ca ? 1 - CFG.chargeIgnore : 1))) + CFG.minDmg;
  const dToA = powD * CFG.dmgK * (sd.atk / (sa.def * (cd ? 1 - CFG.chargeIgnore : 1))) + CFG.minDmg;
  const am = UI.assault ? CFG.assaultLoss : 1;      // 強襲は攻め手の損害が大きい
  applyLoss(D, dToD); applyLoss(A, dToA * am);
  return { ca, cd, dToD, dToA: dToA * am, sa, sd };
}
function recordBattle(A, D, res) {
  const win = res === 'A' ? A : D, lose = res === 'A' ? D : A;
  if (win[0]) NAT(win[0].owner).wins++;
  if (lose[0]) { NAT(lose[0].owner).losses++; addFatigue(lose[0].owner, CFG.fatLose); }
  if (win[0] && lose[0] && atWar(win[0].owner, lose[0].owner)) addWarScore(win[0].owner, lose[0].owner, WAR.scoreBattle);
  for (const a of win) if (total(a.t) > 0) a.wins = (a.wins || 0) + 1;
}
function tidy(list) {
  for (const a of list) for (const k of TK) a.t[k] = Math.max(0, Math.round(a.t[k]));
}
function destroyDead(list) {
  for (const a of list) {
    if (total(a.t) > 0) continue;
    const na = NAT(a.owner);
    if (a.gen != null) { const g = genOf(na, a.gen); if (g) g.army = null; }
    na.armies[a.idx] = null;
    if (UI.selArmy === a) UI.selArmy = null;
    logWar(`${na.name} ${a.name} は壊滅しました`, [a.owner], 'war');
    for (const o of G.nations) if (o.alive && atWar(o.id, a.owner) && armiesAt(a.at).some(x => x.owner === o.id))
      addWarScore(o.id, a.owner, WAR.scoreArmy);
    chron(`${na.name} ${a.name} 壊滅（通算${a.wins || 0}勝）`, a.owner, 'war');
  }
}
function fleeArmies(list, tid) {
  for (const a of list) {
    if (total(a.t) <= 0) continue;
    const opt = roadNbrs(a.at).filter(({ to, e }) => T(to).owner === a.owner && total(a.t) <= ROAD_CAP[e.lv]);
    if (opt.length) { a.at = pick(opt).to; a.path = []; }
    else { TK.forEach(k => a.t[k] = 0); }
  }
}

/* CPU 同士（画面なし） */
function autoBattle(A, D, t) {
  for (let i = 0; i < 8000; i++) {
    const r = battleTick(A, D, t);
    if (!r) break;
    if (sideStats(A, t, false).tot <= 0 || sideStats(D, t, true).tot <= 0) break;
  }
  tidy(A); tidy(D);
  const aw = A.reduce((s, a) => s + total(a.t), 0) > 0;
  recordBattle(A, D, aw ? 'A' : 'D');
  destroyDead(A); destroyDead(D);
  return aw ? 'A' : 'D';
}

/* ---------- 戦闘画面 ---------- */
function runBattle(att, defs, t) {
  refreshSupply();
  const atts = Array.isArray(att) ? att.filter(a => a && total(a.t) > 0) : [att];
  const lead = atts[0];
  const playerInvolved = !G.observer && (lead.owner === 0 || defs.some(d => d.owner === 0));
  const watch = G.observer && CFG.showCpuBattle && UI.speed !== 3 && concerns(lead.owner, defs[0].owner);   // 観戦：選んだ国の戦いだけ見せる（速さ「最速」では見せない）
  if ((!playerInvolved && !watch) || CFG.cpuStop === 'auto') {
    const r = autoBattle(atts, defs, t);
    logWar(`${T(t.id).name}の戦い：${r === 'A' ? NAT(lead.owner).name + ' が勝利' : NAT(defs[0].owner).name + ' が防衛'}`, [lead.owner, defs[0].owner], 'war');
    return Promise.resolve(r);
  }
  if (watch) return showBattle(atts, defs, t, [], true);
  return showBattle(atts, defs, t, []);
}
function showBattle(att, defs, t, nonJoin, auto) {

      <span class="chip">${t.type === 'fort' ? '砦 防御+' + Math.round((fortMul(t) - 1) * 100) + '%' : '都市'}</span>
      <div class="x" style="display:flex;gap:6px">
        <button data-sp="1" class="${auto ? '' : 'btn-p'}">×1</button><button data-sp="2">×2</button>
        <button data-sp="4" class="${auto ? 'btn-p' : ''}">×4</button>${auto ? '<button data-sp="10">×10</button>' : ''}

const relState = (a, b) => a === b ? 'self' : G.dip.state[a][b];
const isTense = (a, b) => a !== b && G.dip.state[a][b] === 'tense';
const inCalm = () => G.turn <= DIP.calmTurns;
const truceLeft = (a, b) => a === b ? 0 : Math.max(0, (G.dip.truce[a][b] || 0) - G.turn);
const coolLeft = (a, b) => a === b ? 0 : Math.max(0, ((G.dip.cool && G.dip.cool[a][b]) || 0) - G.turn);
const prepLeft = (a, b) => Math.max(0, (G.dip.prepAt[a][b] || 0) + DIP.prepTurns - G.turn);
const prepBy = (a, b) => G.dip.prepBy[a][b];
function canPrepare(a, b) {          // 開戦準備を始められるか
  return a !== b && NAT(a).alive && NAT(b).alive && relState(a, b) === 'peace'
    && truceLeft(a, b) <= 0 && coolLeft(a, b) <= 0 && pactLeft(a, b) <= 0 && !sameFaction(a, b);
}

function warReason(a, b) {           // できない理由

  if (relState(a, b) === 'war') return 'すでに戦争中です';
  if (pactLeft(a, b) > 0) return `不可侵条約があります（あと${pactLeft(a, b)}ターン）。破棄すると相手に大義を与えます`;
  const tr = truceLeft(a, b);
  if (tr > 0) return `休戦中です（あと${tr}ターン）`;
  if (isTense(a, b) && prepBy(a, b) !== a) return '相手が軍備を進めています';
  const cl = coolLeft(a, b);
  if (cl > 0 && !isTense(a, b)) return `緊張が解けたばかりです（あと${cl}ターン）`;
  if (isTense(a, b)) return `開戦準備中（あと${prepLeft(a, b)}ターン）`;
  return '先に「開戦準備」が必要です';
}
const atWar = (a, b) => a !== b && G.dip.state[a][b] === 'war';
const isAlly = (a, b) => a !== b && G.dip.state[a][b] === 'ally';
const favorOf = (a, b) => G.dip.favor[a][b];          // a が b をどう思っているか
const canPass = (mover, owner) => owner < 0 || mover === owner || G.dip.pass[owner][mover] || isAlly(mover, owner) || sameFaction(mover, owner);   // 同じ陣営は通れる（守りに駆けつけられる）
function addFavor(a, b, v) {
  if (a === b) return;
  G.dip.favor[a][b] = clamp(G.dip.favor[a][b] + v, -100, 100);
}
function setRel(a, b, st) {

}

/* ---------- 大義名分 ---------- */
function cbOf(a, b) {                 // a が b を攻める大義（理由の文。無ければ空）
  if (a === b || a < 0 || b < 0 || !NAT(b) || !NAT(b).alive) return '';
  if (isTopThreat(b)) return '最大の脅威への対抗';
  if (prepBy(a, b) === b) return '相手が軍備を進めている';
  if ((G.dip.cbUntil[a][b] || 0) > G.turn) return G.dip.cbWhy[a][b] || '大義';
  for (const c of campOf(a)) if (c !== a && atWar(c, b)) return `${NAT(c).name} が戦っている相手`;
  return '';
}
const hasCB = (a, b) => !!cbOf(a, b);
const cbLeft = (a, b) => Math.max(0, (G.dip.cbUntil[a][b] || 0) - G.turn);

  if (a === b || a < 0 || b < 0 || !G.dip.cbUntil) return;

  G.dip.cbUntil[a][b] = G.turn + turns;
  G.dip.cbWhy[a][b] = why;
}
function fabReason(a, b) {
  if (atWar(a, b)) return '戦争中です';
  if (hasCB(a, b)) return `すでに大義があります（${cbOf(a, b)}）`;
  if (fabLeft(a, b) > 0) return `口実を用意しています（あと${fabLeft(a, b)}ターン）`;
  if (NAT(a).gold < CASUS.fabGold) return `ゴールドが足りません（${fmt(CASUS.fabGold)}G）`;

}

}
function fabTurn() {                  // 口実づくりの完了
  const n = G.nations.length;
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    const f = G.dip.fab[a][b]; if (!f) continue;
    if (!NAT(a).alive || !NAT(b).alive) { G.dip.fab[a][b] = 0; continue; }
    if (G.turn < f - 1) continue;
    G.dip.fab[a][b] = 0;

    if (spot) {
      addFavor(b, a, -20);
      for (const c of G.nations) if (c.alive && c.id !== a && c.id !== b) addFavor(c.id, a, -4);

    logMsg(msg, a === 0 || b === 0 ? 'war' : ''); chron(msg, a, 'dip');

/* ---------- 通商協定 ---------- */
const isTrade = (a, b) => a !== b && !!(G.dip.trade && G.dip.trade[a][b]);
const tradePartners = a => G.nations.filter(o => o.alive && isTrade(a, o.id)).map(o => o.id);
const tradeEase = nid => (PERSONA[NAT(nid).persona] || PERSONA.bal).tradeW || 0;
function tradeReason(a, b) {          // a が b に通商を申し込めない理由
  if (isTrade(a, b)) return 'すでに通商しています';
  const st = relState(a, b);
  if (st === 'war' || st === 'tense') return '戦争・緊張中は結べません';
  if (!natNear(a, b)) return '遠すぎて通商できません（隣国とその隣の国まで）';
  if (tradePartners(a).length >= TRADE.max) return `通商協定は ${TRADE.max} 国までです`;
  if (tradePartners(b).length >= TRADE.max) return `${NAT(b).name} は通商相手が埋まっています`;

}
const tradeNeed = b => TRADE.min - (b === 0 ? 0 : tradeEase(b));      // b が応じる好感度
function tradeSwap(b, a) {            // 相手 b の枠が埋まっていても、a の方が好ましければ入れ替える（外す相手を返す）
  const ps = tradePartners(b);

/* ---------- 不可侵条約 ---------- */

/* ---------- 同盟・従属 ---------- */

/* ---------- 脅威度 ---------- */

/* 侵入・占領の可否 */

/* ---------- 状態の変更 ---------- */
const warJust = (a, b) => hasCB(a, b) ? DIP.justMul : 1;   // 大義があれば評判の下がり方は小さい

   講和は主戦国どうしで陣営ごとにまとめて行い、奪った土地は陣営の中で戦いぶり（戦勝点）に応じて分け直す。

function joinSide(id, nid, enemy) {

}

/* 毎ターン：動きのなくなった戦争は膠着として講和（陣営ごと）。長すぎる戦争も厭戦で終わる */
function warTurn() {
  if (!G.wars) return;
  for (const W of Object.values(G.wars)) {
    if (!W.vp0) W.vp0 = {};
    // 降伏：占領された勝利点が限界を超えた国から抜ける
    for (const n of W.sA.concat(W.sB)) {
      if (!inThisWar(W, n)) continue;
      if (W.vp0[n] == null) W.vp0[n] = natVP(n);
      const sp = surrenderProg(W, n);
      if (sp >= surrenderLimit(n)) capitulate(W, n, `国の ${Math.round(sp * 100)}% を占領された`);
    }
    if (!G.wars[W.id]) continue;
    warSuccession();
    if (!G.wars[W.id]) continue;
    const age = G.turn - W.t0, idle = G.turn - (W.act || W.t0);
    if ((age >= 20 && idle >= 10) || age >= 50) {          // 膠着・長期戦は、その時の占領を元に講和
      const lines = endWar(W, null);
      dipReport('peace', W.a, W.b, true, (age >= 50 ? '長い戦に双方が疲れ果てた' : '戦線が膠着した') + (lines.length ? '／' + lines.join('／') : ''));
    }

/* 主戦国が滅んだ・属国になって戦えなくなった時は、陣営で一番戦った国が引き継ぐ（いなければ終戦） */
function warSuccession() {
  if (!G.wars) return;
  for (const W of Object.values(G.wars)) {
    const lost = S => S.every(n => !NAT(n).alive || (W.capd || []).includes(n));      // 全員が降伏・滅亡した陣営は負け
    if (lost(W.sA) && !lost(W.sB)) { endWar(W, { winner: W.sB, full: true }); continue; }
    if (lost(W.sB) && !lost(W.sA)) { endWar(W, { winner: W.sA, full: true }); continue; }
    const act = S => S.filter(n => inThisWar(W, n));
    if (!act(W.sA).length || !act(W.sB).length) {          // どちらかに戦っている国がいなくなった
      const sA = act(W.sA).length, sB = act(W.sB).length;
      endWar(W, sA && !sB ? { winner: W.sA, full: lost(W.sB) } : sB && !sA ? { winner: W.sB, full: lost(W.sA) } : null);
      continue;
    }
    for (const k of ['a', 'b']) {                           // 主戦国が抜けたら、陣営で一番戦った国が引き継ぐ
      if (inThisWar(W, W[k])) continue;
      const cand = act(k === 'a' ? W.sA : W.sB).sort((x, y) => (W.sc[y] || 0) - (W.sc[x] || 0));

    .find(x => x >= 0 && NAT(x).alive && canPrepare(nid, x) && nationsAdjacent(nid, x) && !hasCB(nid, x) && mine >= nationPower(x) * 1.1);
  if (want != null) { startFabricate(nid, want); return; }

    && !hasCB(nid, x.id) && favorOf(nid, x.id) < 45 && mine >= nationPower(x.id) * 1.25)
    .sort((x, y) => nationPower(x.id) - nationPower(y.id))[0];

/* 属国のふるまい：反乱を狙うか、大人しくしているか */
function cpuVassal(nid, lord) {

}
/* 力の差がある隣国に属国化を持ちかける（戦争中なら降伏勧告） */
function cpuVassalOffer(nid) {

  if (!warring && wildCount() > G.terrs.length * .15) return;   // 開拓の時代に平時の従属は求めない

  const cand = [];

let ADJ_KEY = '', ADJ_G = null, ADJ_SET = null;
/* 国どうしの近さ：国境をいくつ越えれば届くか（隣国＝1、隣国の隣＝2、つながらなければ99） */
let HOP_G = null, HOP_KEY = '', HOPS = null;
function natHops(a, b) {
  if (a === b) return 0;
  const k = (G.ownRev || 0) + '_' + G.edges.length;
  if (HOP_G !== G || HOP_KEY !== k) {
    const n = G.nations.length, adj = G.nations.map(() => new Set());
    for (const e of G.edges) {
      const oa = T(e.a).owner, ob = T(e.b).owner;
      if (oa >= 0 && ob >= 0 && oa !== ob) { adj[oa].add(ob); adj[ob].add(oa); }
    }
    HOPS = G.nations.map((_, s0) => {
      const d = new Array(n).fill(99); d[s0] = 0; const q = [s0];
      for (let i = 0; i < q.length; i++) for (const v of adj[q[i]]) if (d[v] === 99) { d[v] = d[q[i]] + 1; q.push(v); }
      return d;
    });

  }

}

function nationsAdjacent(a, b) {

    for (const e of G.edges) {
      const oa = T(e.a).owner, ob = T(e.b).owner;
      if (oa >= 0 && ob >= 0 && oa !== ob) ADJ_SET.add(Math.min(oa, ob) * 4096 + Math.max(oa, ob));
    }

}
/* CPUが出す講和条件 */
function cpuPeaceTerms(a, b) {

  else {
    const want = goal === 'three' ? 3 : goal === 'capital' ? 2 : 1;
    terms.cede = Math.min(opt.cede, want);
    if (opt.gold && Math.random() < .6) terms.gold = opt.gold;
  }
  if (cpuDanger(a) >= 1.0 || (NAT(a).fatigue || 0) >= DIP.fatiguePeace) {   // 苦しい時は要求を下げる

}

/* ============================================================
   内政（人口・食料・治安）・街道の経済効果・戦争疲労

const bldCount = (t, k) => t.bld.filter(b => b === k).length;

/* ---------- 人口 ---------- */
function popCap(t) {
  const base = (t.type === 'city' ? CFG.popCity : CFG.popFort) * t.dev + bldCount(t, 'house') * CFG.houseCap;

}

/* ---------- 治安 ---------- */

}

}

/* ---------- 街道の経済効果 ---------- */
const linkBonus = t => (CFG.roadBonus[clamp(t.link || 0, 0, 3)] || 0) + (t.trait === 'road' && t.link ? .10 : 0);

/* ---------- 食料 ---------- */
function foodGain(nid) {
  let f = 0;
  for (const t of G.terrs) if (t.owner === nid) f += bldCount(t, 'farm') * CFG.farmOut * (t.trait === 'fertile' ? 1.3 : 1) * terrOf(t).food;

/* 兵舎の出力にかかる特色 */
function traitTroop(t, k) {

}
/* その領地が誰と何本つながっているか（飛び地を避けるための目安） */
function contig(t, nid) {

}

const POLICY = {

/* ---------- 領地の毎ターン更新 ---------- */
function updateTerr(t, na, war) {
  const starve = isStarving(na);
  let d = CFG.secRecover + bldCount(t, 'gov') * CFG.secGov + polAdd(na, 'sec');
  if (t.chaos > 0) d += CFG.secChaos;
  if (war) d += CFG.secWar;
  if (starve) d += CFG.secStarve;
  t.sec = clamp(Math.round(t.sec + d), 0, 100);

  const cap = popCap(t);
  if (starve) t.pop = Math.round(t.pop * .97);
  else if (t.chaos <= 0) {
    const rate = clamp(CFG.popGrow * (1 + bldCount(t, 'house') * .5) * (t.sec / 70) * polMul(na, 'grow'), 0, .4);
    t.pop = Math.round(t.pop + (cap - t.pop) * rate);
  }
  if (t.pop > cap) t.pop = Math.round(t.pop - (t.pop - cap) * .25);
  t.pop = Math.max(200, t.pop);

}

function settleCost(nid) {

}

  if (t.settle) return `${NAT(t.settle.by).name} が開拓中です`;
  if (!roadNbrs(tid).some(({ to }) => T(to).owner === nid)) return '自領と隣り合う土地だけ開拓できます';
  if (settlingOf(nid).length >= FRONT.settleMax) return `同時に開拓できるのは ${FRONT.settleMax} か所までです`;
  if (NAT(nid).gold < settleCost(nid)) return `ゴールドが足りません（${fmt(settleCost(nid))}G）`;
  return '';
}

  return true;
}
function settleTurn() {               // ターン終了時：開拓の完了
  for (const t of G.terrs) {
    const st = t.settle; if (!st) continue;
    const na = NAT(st.by);
    if (t.owner >= 0 || !na || !na.alive) { t.settle = null; continue; }
    if (!roadNbrs(t.id).some(({ to }) => T(to).owner === st.by)) {      // 足がかりを失った
      t.settle = null;

      continue;
    }
    if (G.turn < st.done - 1) continue;
    t.settle = null; t.owner = st.by; t.sec = FRONT.settleSec; t.chaos = 0;
    G.ownRev = (G.ownRev || 0) + 1;
    infraChanged(t);

function cpuSettle(nid) {             // CPU：隣の無主の地を治める
  const na = NAT(nid), P = PERSONA[na.persona] || PERSONA.bal;
  let slots = FRONT.settleMax - settlingOf(nid).length;
  if (slots <= 0) return;
  const war = G.nations.some(o => o.alive && atWar(nid, o.id));
  const reserve = (war ? 7000 : 1200) / (P.settle || 1);
  const cand = [];
  for (const t of G.terrs) {
    if (t.owner >= 0 || t.settle) continue;
    const nbs = roadNbrs(t.id);

    if (!mineN) continue;
    let sc = mineN * 6 + (t.type === 'city' ? 10 : 4) + (t.trait ? 8 : 0) + t.pop / 1000;
    if (nbs.some(({ to }) => T(to).owner >= 0 && T(to).owner !== nid)) sc += 5;   // 取られる前に

    if (!na.alive) continue;
    na.mile = na.mile || {};
    const own = G.terrs.filter(t => t.owner === na.id).length;
    for (const m of TERR_MILE) {
      if (own >= m && !na.mile['t' + m]) { na.mile['t' + m] = 1; chron(`${na.name} の版図が ${m} 領地に達する`, na.id, 'mile'); }
    }
    for (const a of na.armies) {
      if (!a) continue;
      for (const m of WIN_MILE) {
        const key = `w${a.idx}_${m}`;
        if ((a.wins || 0) >= m && !na.mile[key]) { na.mile[key] = 1; chron(`${na.name} ${a.name}、通算 ${m} 勝`, na.id, 'mile'); }
      }
      const g = a.gen != null ? genOf(na, a.gen) : null, tot = total(a.t);
      if (!g) continue;
      if (tot > (g.maxLed || 0)) g.maxLed = tot;
      if (tot >= 8000 && tot >= (na.recLed || 0) * 1.25) {
        na.recLed = tot;
        chron(`${g.name} 将軍が最大兵力 ${fmt(tot)} を率いる`, na.id, 'mile');
      }

}

    if (sideOf(W, foe) && !sideOf(W, foe).includes(nid)) {      // 降伏の近い国に集中
      const k = W.id + '_' + foe + '_' + G.turn + '_' + (G.ownRev || 0);

      b += v * 25;

function cpuObjective(nid, list, bfsOf) {

    let stage = null, sd = Infinity;

      const w = ROAD_CAP[e.lv] === Infinity ? 0 : (e.lv === 1 ? 2 : 1);   // 細い街道は集結に向かない
      if (near + w < sd) { sd = near + w; stage = to; }
