<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>国盗り年代記</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":3012436,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// 大きなファイルをブラウザに保存して使い回す（tools/add_sw.sh）
let KUNITORI_FILES = {"index.js":"b54de01ebd11d86e","index.wasm":"c91d71625bc4706b","index.pck":"5d42f3d488f37aca","index.png":"3d807795286dcd27","index.icon.png":"06d46fcd56c0af0c","jpmap0.bin":"b098cbbc07ff35ce","jpmap1.bin":"d4824aedd75409f9","jpmap2.bin":"c8d3395c8ed855f6","jpmap3.bin":"8adab98df7683370","bgm_peace.ogg":"2056b4fa1890699d","bgm_war.ogg":"2911228985ff5c84","index.audio.worklet.js":"fa4ddbcecba3dbae","index.audio.position.worklet.js":"006bd6de7d9b8a8c"};
async function kunitoriPrep() {
	try {
		if (!("caches" in window) || !("serviceWorker" in navigator) || location.protocol === "file:") return;
		const c = await caches.open("kunitori-files");
		// 一覧は files.json から毎回取り直す（index.html はブラウザに最大10分残るので、公開の直後でも新しい版を読むように）
		try { const fr = await fetch("files.json", { cache: "no-store" }); if (fr.ok) KUNITORI_FILES = await fr.json(); } catch (e) {}
		await c.put("kunitori-manifest", new Response(JSON.stringify(KUNITORI_FILES)));
		let first = !navigator.serviceWorker.controller;
		for (const r of await navigator.serviceWorker.getRegistrations()) { const w = r.active || r.waiting || r.installing; if (w && w.scriptURL.indexOf("sw.js?v=") >= 0) { await r.unregister(); first = true; } }
		const reg = navigator.serviceWorker.register("sw.js").catch(() => null);
		if (first) await Promise.race([new Promise((r) => navigator.serviceWorker.addEventListener("controllerchange", r, { once: true })), new Promise((r) => setTimeout(r, 3000))]);
	} catch (e) {}
}
// 起動の後：まだ保存していないファイルを裏で保存し、古い版の保存を消す
async function kunitoriFill() {
	try {
		if (!("caches" in window)) return;
		await new Promise((r) => setTimeout(r, 15000));
		const c = await caches.open("kunitori-files");
		const want = {};
		for (const [n, h] of Object.entries(KUNITORI_FILES)) want[new URL(n + "?h=" + h, location.href).href] = true;
		for (const req of await c.keys()) if (!want[req.url] && !req.url.endsWith("kunitori-manifest")) await c.delete(req);
		for (const k of Object.keys(want)) {
			if (await c.match(k)) continue;
			const r = await fetch(k, { cache: "no-store" });
			if (r.ok) await c.put(k, new Response(await r.blob(), { headers: { "content-type": r.headers.get("content-type") || "application/octet-stream" } }));
		}
	} catch (e) {}
}

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		kunitoriPrep().then(() => engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			kunitoriFill();
		}, displayFailureNotice));
	}
}());
		</script>
	</body>
</html>
